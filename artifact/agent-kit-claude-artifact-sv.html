ta är tom görs det svagare av de två valen om: dess näst starkaste värde som har en form","en form har {1, 2, 3} konturer, en inuti en annan, när dess detaljer är enkla, medel eller sirliga","storlek: {14, 22, 32} steg ut från mitten; ljusstyrkan är {55, 80, 100} procent av dess färg","värmen väljer färgen: kall {blå, lila}, medel {grön, grå}, varm {orange, gul, röd, rosa}, och varje figur behåller den första som ingen annan i filmen har","när ingen expert sa något om utseendet: använd Kens former och färger från 1978, i Rollistans ordning: {stjärna, kvadrat, cirkel, triangel} i {grön, röd, orange, gul}","en figur flyttar sig {5, 10, 16} steg per bildruta; kurvor gör dess väg vågig upp till {0, 10, 22} steg; ryckighet rycker den {0, 3, 8} steg","livlighet vrider den {3, 12, 30} grader per bildruta; höjden lyfter den {-50, 0, 50} steg; en som rör sig fritt vänder {3, 2, 1} gånger, från planlös till målmedveten","visa planens steg efter varandra, men när komplexiteten inte är låg visas en känsla under steget före","högst {32} bildrutor, {4} per sekund: när stegen behöver fler får vart och ett färre","vakten stoppar {2} försök att ta sig förbi, och det sista går nästan","namn under figurerna: {ja} · skärmen är {svart}, som Anis tv","skriv ett Logo-program: en TO-procedur för varje figurs utseende, och en FOR-loop för varje steg, med en kommentar om vad den visar","håll programmet under 3 900 tecken: när det är längre, utelämna kommentarerna, sedan namnen, sedan de sista stegen, och säg det","säg vilka bildrutor som visar vad, och hur varje figur ser ut"],code:["function run(input, params, h) {","  const d = input.data || {};",'  const low = s => String(s == null ? "" : s).trim().toLowerCase();','  const listOf = s => String(s == null ? "" : s).split(",").map(low);',"  const three = (v, x) => (Array.isArray(v) && v.length === 3 ? v.map(Number) : x);","  const r1 = v => Math.round(v * 10) / 10;","  const call = n => (d.called || {})[n] || n;","  const cap = s => s.charAt en nästan klarar själv. Var snäll och uppmuntrande. Håll svaren till två till fyra korta meningar.\nMen när eleven frågar hur man gör något i själva kitet (var en knapp finns, hur man ändrar en inställning), säg det rakt ut med hjälp av fakta nedan, och ställ sedan gärna en fråga. Säg aldrig att något inte går om ett faktum nedan säger hur det görs.\nFakta om kitet:\n- 🔍 Titta inuti visar alla agenter och alla regler. Klicka på en agent (där, eller på dess knapp på scenen) för att öppna dess redigerare och ändra den. En agents redigerare visar också dess Kopplingar: vilka agenter som kan skicka meddelanden till den, och dess egna regler, som kan ändras där.\n- En regel säger: när en agent svarar, och om något är sant, skicka dess ord, dess data och/eller dess bild till en annan agent. Regler visas som meningar med agentknappar. Bocken framför en regel slår på eller av den (en avslagen regel är grå). ✎ Ändra visar dess reglage (tre kryssrutor för vad som ska skickas), och ✓ Klar lägger tillbaka den. Vissa mikrovärldar har brytare med ett klick, ovanför reglerna och på scenen, som ändrar flera regler på en gång (i Stenutmaningen: Prickräknaren räknar i stället för Ögonen).\n- Modeller: en vuxen lägger till modeller (och eventuella nycklar) i ⚙️ Inställningar. När mer än en modell är inställd väljer eleven själv vilken modell varje AI-agent använder, utan Inställningar: i raden Modeller på scenen, under agentknapparna, eller i agentens redigerare under “Dess modell”. Avsnittet MODELLER nedan säger vad som är inställt nu.\n- “🙋 Spela själv som …” på scenen låter eleven ta en agents plats i körningen och svara i stället för den.\n- ▶ Kör, ⏭ Steg (ett meddelande i taget), ↺ Börja om och rutan för antal omgångar finns på scenen. Loggen visar varje meddelande; “Visa alla tekniska detaljer” visar exakt vad en modell fick.\n- En programmerad agents redigerare visar vad den Får, Säger och Minns (uträknat från dess scenarier, eller skrivet av eleven som de första raderna i dess pseudokod); översättaren håller sig till det. “↩ Gå tillbaka till versionen som körs” ångrar en ändring som inte har översatts.\n- Scenarier är tester för en programmerad agent, i dess redigerare. En AI-agent som räknar saker i bilder har en testbänk i sin redigerare.\n- Ett program som samlar (som Omröstning eller Domaren) väntar tills det har fått flera meddelanden (sitt {wait}-tal) och körs sedan en gång på alla. Om ett svar aldrig kommer körs det på det som finns i slutet. En AI-agent kan också samla (i dess redigerare: “Den svarar … när den har N meddelanden”); då ser den alla deras bilder tillsammans, numrerade i ordning, som Kritikern i exemplet Evolution.\n- ＋ Nytt samhälle erbjuder också exempel att börja från: Evolution (Mutator 1, 2 och 3 ändrar en teckning, Kritikern ger poäng åt föräldern och varianterna tillsammans, och Väljaren behåller vinnaren; loggens flik Släktträd visar vilken bild som kom från vilken) och Två svar (samma fråga till en Vanlig agent och till en Eftertänksam som först stannar upp vid fyra principer: tomhet, icke-dualitet, medveten närvaro och gränslös omsorg) och Tre i rad (du spelar X mot Motståndaren, en AI; Domaren, ett program, håller reda på brädet, vägrar en ruta som redan är tagen och avgör vem som vann; en variant låter två AI:er spela) och Byteshandel med studentskagg (tre AI-handlare byter russin, cashewnötter och saltkringlor; Kassaboken, ett program, håller reda på vem som har vad och vägrar bud som inte går ihop) och Konstnären och kritikern (Ken Kahns samhälle: Konstnären ritar i Logo, Kritikern, som vet vad som efterfrågades, ger poäng åt varje bild och föreslår en ändring, och Poängräknaren håller reda på poängen) och Mini-Ani (Ken Kahns program Ani från 1978 i miniatyr, bara med program, så den behöver ingen modell: Rollistan läser en berättelse; Personlighet, Utseende, Relationer och Smak föreslår hur varje figur rör sig och ser ut; Valpunkterna avgör deras strider öppet och säger varför; Metodväljaren planerar varje scen, och Regissören skriver den som en film i Logo som Ritaren spelar) och Mini-Ani med AI-röster (samma program, med AI-agenter där det behövs ord: en AI-animatör föreslår med Anis ord, och Valpunkterna väger dess rader som en experts, 2 mot ett eget ords 3; en Läsare gör om en berättelse med egna ord till Rollistans meningar och får tillbaka Rollistans klagomål om den inte kan läsa dem; Berättarrösten samlar Metodväljarens planer och berättar filmen till sist; en omkopplare låter Du föreslå också, med 3).\n- En agent som heter Du är eleven: körningen väntar på elevens svar.\n- Biblioteket (+ Lägg till en agent, i Titta inuti) har de här färdiga programmen: "+Object.keys(He).filter(e=>!He[e].group).map(e=>He[e].name+" ("+He[e].about+")").join("; ")+"\n- En regel kan komma från Du (“när Du startar körningen, skicka dina ord till …”), så att starten når mer än en agent. En regel kan också säga “när körningen slutar”: då skickas agentens sista meddelande vidare, en gång, allra sist (i Berättelsekedjan skickar Boken hela berättelsen till Redaktören på det sättet).\n- Allt sparas i den här webbläsaren medan man arbetar (det finns kvar om sidan laddas om); i ⚙️ Inställningar kan sparandet stängas av, och då försvinner arbetet när fliken stängs. “Radera det här samhället”, i Titta inuti, raderar ett av elevens egna samhällen från den här webbläsaren för gott; mikrovärldar har “↺ Börja om” i stället.\n- Den översta raden har de nio mikrovärldarna och sedan Dina: de fyra egna samhällen som använts senast (gjorda från början, från ett exempel, som kopia eller genom import). ☰ Alla dina listar alla, för att öppna dem, eller för att bocka för flera och radera dem. Om man importerar en fil med samma namn som ett av ens egna samhällen får man välja om det ska ersättas eller om båda ska behållas (det nya får “(2)”); väljer man ett exempel som man redan har gjort börjar det om från början, eller, om man har ändrat sitt, får man välja om man vill börja på ett nytt eller gå tillbaka till det ändrade.\n- Tal: 🔊 Läs upp (översta raden) läser upp ord man klickar på och säger vad en knapp är när man pekar på den; en 🎤 dyker upp vid rutan man skriver i, så att man kan prata i stället för att skriva; Hjälparens 🎤 frågar genom tal och läser upp svaret. Om webbläsaren inte kan lyssna förklarar 🎤 datorns egen diktering (Windows-tangenten + H, eller Mac-datorns Glob-tangent två gånger).\n- ⬇ Exportera och ⬆ Importera, högst upp på sidan, sparar samhället man är i som en fil och öppnar ett från en fil. En agents emoji ändras genom att klicka på den högst upp i dess redigerare.\n- ＋ Nytt samhälle, efter mikrovärldsknapparna, startar ett samhälle från början eller kopierar det man är i. I ett eget samhälle kan man i Titta inuti ändra dess namn, fråga, introduktion, frågor och start. “+ Lägg till en agent” lägger till en ny AI-agent, en Ritare eller ett färdigt program från biblioteket.\n- Efter en körning visar varje AI-agents knapp på scenen hur många modellanrop den gjorde och hur lång tid de tog.\n- Minne och upprepningar: en AI-agents redigerare har “Den minns”: “ingenting: varje meddelande är nytt” (då kan den säga samma sak igen, som en Skämtare som drar samma skämt) eller “hela samtalet i den här körningen”. Inget minns något från en körning till nästa. Upprepningsvakten, i biblioteket (Titta inuti, sedan + Lägg till en agent), är en minnesagent för upprepningar: en spärr som minns allt den får i en körning, skickar vidare allt nytt ordagrant och stoppar allt den har hört förut (mer än hälften samma ord; dess {half} kan ändras), och säger när den hörde det. Så får man den att stoppa en Skämtares upprepade skämt: en regel från Skämtaren till Upprepningsvakten; en regel från Upprepningsvakten till Betygsättaren, som bara skickar nya skämt (när pass är false väntar dess andra regler); och en regel från Upprepningsvakten tillbaka till Skämtaren om dess data säger att pass är false, så att Skämtaren hör att det var en upprepning och försöker igen. 9db0d8' stroke-width='1.5'/><text x='382' y='89'>🔎 Namnvakten</text><path d='M112 84H164' stroke='#5b6b8c' stroke-width='2' marker-end='url(#gArrow)'/><path d='M274 84H326' stroke='#5b6b8c' stroke-width='2' marker-end='url(#gArrow)'/><rect x='70' y='8' width='136' height='34' rx='10' fill='#fff' stroke='#c9d3e6'/><text x='138' y='30'>“Pip fann ett skal.”</text><path d='M138 42L138 76' stroke='#c9d3e6' stroke-dasharray='3 3'/><rect x='232' y='8' width='136' height='34' rx='10' fill='#fff' stroke='#c9d3e6'/><text x='300' y='30'>“Han tog hem det.”</text><path d='M300 42L300 76' stroke='#c9d3e6' stroke-dasharray='3 3'/></g></svg><figcaption>Varje agent får ett meddelande, gör sitt jobb och skickar ett meddelande vidare. <b>Regler</b> säger vem som får vad.</figcaption></figure><p>Agent Kit är till för att bygga samhällen. Några agenter är AI:er som följer instruktioner du kan läsa, några är små program, och en, Ritaren, gör om ritprogram till bilder. Ingenting är dolt.</p><ol class='steps'><li><b>Prova en.</b> Välj <b>Berättelsekedjan</b>, den första mikrovärlden högst upp, och läs dess fråga. Innan du trycker på <b>▶ Kör</b>, säg vad du tror kommer att hända. Titta sedan på skribenterna, omgång för omgång.</li><li><b>Ändra en sak.</b> Kryssa i ett val under starten (som “Skribent A minns allt”), eller tryck på <b>🔍 Titta inuti</b> och ändra en agents instruktioner eller en regel. Kör igen. Vad ändrades, och varför?</li><li><b>Gör det till ditt.</b> Tryck på <b>＋ Nytt samhälle</b> efter mikrovärldsknapparna. Kopiera den du var i, börja från noll, eller börja från ett exempel som <b>Evolution</b>, <b>Två svar</b>, <b>Tre i rad</b>, <b>Byteshandel med studentskagg</b>, <b>Konstnären och kritikern</b>, eller ett av de fyra <b>Mini-Ani</b>-exemplen. Ge det ett namn och en fråga i Titta inuti, lägg till en agent med <b>+ Lägg till en agent</b>, och koppla ihop agenterna med regler.</li></ol><p><b>Tre saker att veta när du gör ett eget:</b></p><ul class='guide-facts'><li>Ett nytt samhälle har redan en agent, som heter <b>Agent</b>. Gör den till din första agent (ge den ett namn och instruktioner), eller ta bort den.</li><li>Agenter pratar bara när en <b>regel</b> säger åt dem att göra det. En agent som ingen regel skickar något till hör ingenting.</li><li>Starten går till en agent. Scenen visar vilken, bredvid starten, och där kan du ändra det.</li></ul><p>Efter en körning säger <b>🔎 Det här märkte kitet</b>, under scenens knappar, till om något sådant har gått fel.</p><p>Fastnat? Fråga <b>🤔 Hjälparen</b> (nere till höger). Den vet var allt finns, och den ställer frågor tillbaka. I ett eget samhälle gör <b>🧱 Bygg med mig</b> den till en guide: du bestämmer vad du vill göra, och den ställer en fråga i taget medan du bygger. Jobbar du med en kompis? En av er styr och den andra gissar vad som ska hända; byt efter varje körning.</p><details class='ref'><summary><b>Allt annat, när du behöver det</b></summary><h4>Scenen</h4><p><b>▶ Kör</b> fortsätter tills omgångsgränsen är nådd. <b>⏭ Steg</b> levererar ett meddelande i taget, och Kör fortsätter därifrån. <b>↺ Börja om</b> nollställer körningen. <b>🙋 Spela själv som …</b> låter dig ta en agents plats: körningen väntar på ditt svar. Val med ett klick under starten ändrar flera regler på en gång. Om en vuxen har ställt in mer än en modell kan du i raden <b>Modeller</b> välja vilken modell varje AI-agent använder. Efter en körning visar varje AI-agents knapp hur många anrop den gjorde till modellen.</p><h4>Kartan</h4><p><b>🗺️ Karta</b>, bredvid 🔍 Titta inuti, visar hela samhället som en bild. Varje agent är en ruta, och varje regel är en pil som visar när den skickar. Den börjar från Du, till vänster. En streckad pil är en regel som är avstängd. Efter en körning visar varje pil hur många meddelanden som gick längs den (×4), så att du ser vilka som användes. Klicka på en agent i bilden för att öppna den. <b>📌 Behåll den på scenen</b> lägger den under ▶ Kör, där den lyser upp medan körningen pågår: agenten som arbetar nu, och pilarna som dess senaste svar gick längs.</p><h4>Regler</h4><p>I Titta inuti läses varje regel som en mening: <i>När Konstnären svarar, skicka dess ord till Ritaren.</i> Kryssrutan framför slår på eller av en regel. <b>✎ Ändra</b> visar regelns delar: vem den kommer från, ett villkor (som <i>om dess data säger att pass är false</i>), vad som ska skickas (ord, data, bild) och till vem. <b>Säg att det kommer från en annan agent</b> berättar för AI-agenten som får meddelandet vem som skickade det, och att det inte är en människa. Utan den kan två AI-agenter fastna i att tacka varandra i stället för att göra sina jobb. En regel kan komma från <b>Du</b>, så att starten når mer än en agent, och en regel kan vänta på <b>slutet av körningen</b>, som den som skickar Boken i Berättelsekedjan till Redaktören.</p><h4>Agenter</h4><p><b>AI-agenter</b> följer instruktioner som du kan ändra i deras redigerare. <b>Programmerade agenter</b> är pseudokod: tal inom gröna { } är inställningar du kan ändra; ändra en rad så gör översättaren om den till JavaScript (<b>Kika under huven</b> visar båda). <b>Scenarier</b> är tester för ett program: något som programmet får och vad det ska svara. Ett rött scenario visar vad som gick fel, och du kan spara vilket steg som helst i loggen som ett nytt scenario. Några agenter <b>samlar</b>: de väntar på flera meddelanden och svarar sedan på alla på en gång; en AI-agent som samlar ser alla bilderna bredvid varandra. En agent som heter <b>Du</b> är du. Varje agents redigerare visar dess <b>Kopplingar</b>: vilka som kan skicka meddelanden till den, och dess egna regler. Klicka på en agents emoji, högst upp i dess redigerare, för att välja en annan.</p><h4>Spara och dela</h4><p>Allt sparas i den här webbläsaren medan du arbetar, så allt finns kvar om du laddar om fliken. Det stannar i den här webbläsaren på den här datorn. <b>⬇ Exportera</b> högst upp sparar samhället du är i som en fil, som du kan behålla, flytta eller ge till en kompis; <b>⬆ Importera</b> öppnar en sådan fil. En vuxen kan stänga av sparandet i ⚙️ Inställningar; då försvinner arbetet när fliken stängs. <b>Radera det här samhället</b>, i Titta inuti, raderar ett av dina egna samhällen från den här webbläsaren för alltid. Dina egna samhällen kommer efter mikrovärldarna, under <b>Dina</b>: de fyra du använde senast, och <b>☰ Alla dina</b> för resten, där du också kan kryssa i flera och radera dem på en gång.</p><h4>Lyssna och prata</h4><p>Tryck på <b>🔊 Läs upp</b> högst upp och klicka sedan på ord för att höra dem; peka på en knapp för att höra vad den gör. Tryck igen, eller på Esc, för att sluta. Om du vill prata i stället för att skriva, klicka i en ruta och tryck på <b>🎤</b> bredvid den; hos Hjälparen ställer 🎤 din fråga och läser upp svaret för dig. Om din webbläsare inte kan lyssna visar 🎤 hur din dator kan göra det (på Windows: tryck på Windows-tangenten + H).</p><h4>Loggen</h4><p>Varje meddelande finns i <b>Loggen</b>. Öppna ett för att se vad agenten fick och vad den sa. <b>Visa alla tekniska detaljer</b> visar exakt vad en modell fick och vad som kom tillbaka. En <b>…</b> öppnar text som kortats av, och en bild öppnas i full storlek när du klickar på den. Efter en körning går <b>Starta uppspelningen</b> igenom den ett meddelande i taget.</p><h4>Logo</h4><p>Agenter som ritar skriver <b>Logo</b>: <code>FORWARD 50</code>, <code>RIGHT 90</code>, och <code>REPEAT 4 [FORWARD 50 RIGHT 90]</code> för en kvadrat. I Viskleken låter “Börja med en teckning” dig skriva Logo själv, och du kan ändra vilken teckning som helst i loggen och se den ritas. <code>WAIT 15</code> sparar bilden så långt som en bildruta i en film (WAIT räknar i sextiondels sekunder, så 15 är en kvarts sekund): <code>REPEAT 12 [CLEARSCREEN RIGHT 30 * REPCOUNT FORWARD 100 WAIT 15]</code> blir en film med 12 bildrutor, och scenen spelar den med ▶ och ett reglage.</p><h4>Modeller</h4><p>En vuxen väljer modellerna i ⚙️ Inställningar: Gemini Nano (gratis, inbyggd i Chrome), eller Claude, Gemini eller OpenAI med en nyckel. Om de lägger till fler än en väljer du på scenen vilken agent som använder vilken. Varje mikrovärlds frågekort säger vilken modell som passar den.</p><h4>Tips</h4><ul><li>Ändra en sak i taget.</li><li>Kör samma start två gånger och jämför: AI-agenter säger inte alltid samma sak.</li><li>Innan du trycker på Kör, säg vad du tror kommer att hända.</li></ul></details>"},teacher:{title:"📕 En guide för lärare",html:()=>{const e=a.DEFAULT_MODELS,t=a.modelLabel,n=(e,t,n,a)=>"<tr><td><b>"+e+"</b></td><td>"+t+"</td><td>"+n+"</td><td>"+a+"</td></tr>";return"<p class='big-idea'><b>Den stora idén:</b> det som ser ut som intelligens kommer ofta från hur enkla agenter är ordnade. En liten modell med en anteckningsbok på fyra rader spelar Hemliga talet mycket bättre än en utan; Prickräknaren, som inte kan se, räknar bättre än Ögonen; Boken minns det som Redaktören slätar över.</p><h3>Vad eleverna gör</h3><p>Eleverna (ungefär 10 till 16 år) kör, undersöker, felsöker och ändrar små samhällen av agenter: AI-agenter, programmerade agenter skrivna i pseudokod som går att ändra, och en Ritare som ritar Logo. Allt är en glaslåda: varje prompt, varje svar, varje program och varje meddelande syns. Sedan gör de egna med <b>＋ Nytt samhälle</b>.</p><h3>Mikrovärldarna, i undervisningsordning</h3><ol class='worlds-list'><li><b>Berättelsekedjan: “Vem minns draken?”</b> Tre skribenter lägger till en mening var; Namnvakten kollar att hjälten fortfarande är med; Boken sparar varje mening; när körningen är slut berättar Redaktören historien igen. <i>Kraftfulla idéer:</i> varje agent får bara det som reglerna skickar till den (utöver det som dess modell lärde sig under träningen); ett protokoll (Boken) och en återberättelse (Redaktören) är olika sorters minne.</li><li><b>Hemliga talet: “Kan en anteckningsbok göra den smartare?”</b> Gissaren har inget minne; Anteckningsboken, ett program på fyra rader, sparar ledtrådarna. <i>Kraftfulla idéer:</i> bokföring kan se ut som intelligens; minne är inte samma sak som strategi.</li><li><b>Hittegods: “Var hamnade den?”</b> Hittaren sätter ett namn på en teckning, och regler skickar den till hyllor utifrån orden. <i>Kraftfulla idéer:</i> program tar allt bokstavligt och modeller är luddiga; ordvalet avgör var saker hamnar.</li><li><b>Viskleken: “Vart tar den vägen?”</b> Konstnären ritar en mening i Logo, Beskrivaren beskriver bilden, varv efter varv. <i>Kraftfulla idéer:</i> upprepning, fixpunkter och cykler, variation mellan körningar.</li><li><b>Stenutmaningen: “Varför vann Formgivaren?”</b> Formgivaren ritar stenar, Ögonen räknar dem, Domaren (ett program) släpper igenom eller stoppar, och Kritikern säger vad som ska rättas. Ett klick byter ut Ögonen mot Prickräknaren. <i>Kraftfulla idéer:</i> kritiker kan luras; att uppfatta är inte samma sak som att bedöma.</li><li><b>Tre ögon: “Tänker tre huvuden bättre än ett?”</b> Tre Ögon räknar samma bild och programmet Omröstning väljer det vanligaste svaret. <i>Kraftfull idé:</i> omröstning hjälper när de som röstar är ganska bra och gör olika misstag; kopior av samma modell gör ofta fel samtidigt.</li><li><b>Lura ögonen: “Kan en teckning lura den som tittar?”</b> Skojaren ritar stenar för att lura Ögonen; Domaren räknar poängen. <i>Kraftfull idé:</i> en motståndare hittar svagheter som ett vänligt test aldrig skulle hitta.</li><li><b>Skämtverkstaden: “Blir skämt roligare med kritiker?”</b> Skämtaren skriver, två Kritiker skickar kommentarer, och eleven betygsätter varje version. <i>Kraftfull idé:</i> vems omdöme som räknas, och om kritiker gör arbetet bättre eller bara försiktigare.</li><li><b>Liten hjälpare, stor hjälpare: “När behöver du den stora?”</b> En billig modell försöker först; Rulltrappan lämnar över jobbet till en stark modell när den misslyckas. Den behöver två modeller. <i>Kraftfull idé:</i> kostnad mot förmåga.</li></ol><p><b>Exempel att börja från</b> (“＋ Nytt samhälle”): <b>Evolution</b>, där tre Mutatorer ändrar en teckning, Kritikern ger poäng åt föräldern och varianterna tillsammans, och Väljaren behåller vinnaren; loggens Släktträd visar vilken bild som kom från vilken. <i>Kraftfull idé:</i> en enkel kritiker och en väljare, ordnade i en slinga, styr en modell dit den inte skulle hamna på egen hand. Det behöver en modell som ser bilder bra, och gör ungefär 4 modellanrop per omgång. <b>Två svar</b>, efter artikeln <i>Contemplative Artificial Intelligence</i> (Laukkonen med flera, 2025): samma fråga går till en Vanlig agent och till en Eftertänksam agent som ombeds stanna upp vid fyra principer först. <i>Kraftfull idé:</i> instruktionerna är den enda skillnaden, så eleverna kan ändra en princip och se vad den gör; och klok är inte samma sak som försiktig. Vilken modell som helst; 2 eller 3 anrop per körning. <b>Tre i rad</b>: en elev spelar X mot Motståndaren, en AI-agent, och programmet Tre i rad-domaren håller ordning på brädet. <i>Kraftfull idé:</i> modellen föreslår och programmet bestämmer; en regel som är skriven som ett program gäller hur säker modellen än låter. Vilken modell som helst (svagare modeller gör fler otillåtna drag, och det är poängen); ungefär 5 anrop per parti, eller 9 med Två AI:er. <b>Byteshandel med studentskagg</b>, från Ken Kahns experiment: tre AI-handlare, som var och en börjar med en ingrediens, turas om att byta, och programmet Kassaboken sköter bokföringen. <i>Kraftfull idé:</i> agenter kan prata sig fram till en affär, men det krävs ett program för att föra böckerna; när en enda chattbot spelade alla tre handlarna gick grammen inte längre ihop. Prova en annan modell för varje handlare. Ungefär 2 anrop per byte, högst 20 omgångar. <b>Konstnären och kritikern</b>, Ken Kahns samhälle: Konstnären ritar, Kritikern, som vet vad som efterfrågades, ger varje bild poäng och föreslår en ändring, och Poängräknaren håller koll på poängen. <i>Kraftfull idé:</i> om feedback hjälper beror på vem som ger den och vad den vet; och en kritiker som bedömer arbete som gjorts efter dess egna råd är kanske ingen rättvis domare. Behöver en modell som ser bilder bra; 2 anrop per omgång. <b>Mini-Ani</b>, Ken Kahns program Ani från 1978 i miniatyr (<a href=\"https://toontalk.github.io/ani/\" target=\"_blank\" rel=\"noopener\">Anis egen film från 1978</a>): Rollistan läser en berättelse; Personlighet, Utseende, Relationer och Smak föreslår hur varje figur rör sig och ser ut; Valpunkterna avgör deras strider öppet och säger varför; Metodväljaren planerar varje scen, och Regissören skriver den som en film i Logo. <i>Kraftfull idé:</i> smak går att bygga: små experter grälar öppet, filmen ändras när man lägger till kunskap, och varje val kan säga varför. Den behöver ingen modell, så en körning gör inga anrop. <i>Mer att prova:</i> låt blyg föreslå ”mycket snabb” (kan Styvmodern fortfarande stå vakt i scen 2, och vem säger varför inte?); låt en ändring ta 0 bildrutor hos Metodväljaren (vilket ser mest ut som magi?); gör filmen subtil, med tydlighet låg hos Smak (hur många saker visar fortfarande vem som är blyg?). <b>Mini-Ani med AI-röster</b> lägger till AI-agenter där det behövs ord: en AI-animatör vars rader med Anis ord Valpunkterna väger som en experts, en Läsare som gör om en berättelse med egna ord till Rollistans meningar, och Berättarrösten som berättar den färdiga filmen; du kan vara med som en expert till. <i>Kraftfull idé:</i> språket kan gå till modeller medan vägningen stannar hos program som man kan läsa. Vilken modell som helst som skriver korta rader; 4 eller 5 anrop per körning.</p><h3>Vilken modell, och hur många anrop</h3><p>Det är oftast valet av modell som gör att lektioner kör fast, så här är vad vi har sett. Anrop betyder modellanrop under en körning med standardantalet omgångar; varje AI-agents knapp räknar dem efter en körning.</p><table class='guide-table'><tr><th>Mikrovärld</th><th>Modell</th><th>Varför</th><th>Anrop per körning</th></tr>"+n("Berättelsekedjan","vilken som helst, även Ge tt svar som låter troligt skulle ha varit.</li><li><b>“Programmet är smart.”</b> Programmet som körs är den JavaScript som översatts från dess pseudokod, och det gör exakt vad som står där, och därför är “hundar” inte “hund”. Med scenarier kontrollerar man att de två stämmer överens.</li><li><b>“Samma start, samma resultat.”</b> AI-agenter varierar från körning till körning; program gör det inte.</li><li><b>“Större är alltid bättre.”</b> Liten hjälpare, stor hjälpare visar när det inte är värt det.</li><li><b>“Redaktörens berättelse är det som hände.”</b> Boken är protokollet.</li></ul><h3>Säkerhet och integritet</h3><ul><li><b>Det eleverna skriver skickas till modellens leverantör</b> (Anthropic, Google eller OpenAI), tillsammans med agenternas meddelanden och bilder, utom med Gemini Nano, som körs på datorn. Säg till eleverna att inte skriva namn, adresser eller något personligt.</li><li>Varje modellanrop börjar med en fast, synlig säkerhetsinledning för en ung publik.</li><li>Nycklar sparas bara i den här webbläsaren om du väljer att komma ihåg dem; de hamnar aldrig i exporterade filer.</li><li>Importerade filer kontrolleras: texten rensas, och all JavaScript i dem slängs och översätts på nytt här.</li><li>Program körs bakom en kontroll, en stegräknare och (där sidan tillåter det) en Worker. Teckningar är Logo, som läses av en tolk som bara kan flytta sköldpaddan.</li><li>Hjälparen ställer frågor tillbaka, och säger aldrig hur man rättar ett scenario som misslyckas.</li></ul>"}}};function ta(e){let n=t.cleanId(e)||"society",a=2;const r=n;for(;$.societies[n];)n=r+"-"+a++;return n}async function na(e){const{society:t,trace:n}=i.importSociety(e),a=$.order.find(e=>$.societies[e].title.trim().toLowerCase()===t.title.trim().toLowerCase());let r=null;if(a&&!le(a)){const e=await Ue("Du har redan ett samhälle som heter “"+t.title+"”. Vill du ersätta ditt med det i den här filen, eller behålla båda?",{title:"Importera “"+t.title+"”",choices:[["replace","Ersätt mitt","dange
