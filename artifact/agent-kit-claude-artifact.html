: game };',"  }","  let move = null;","  for (const word of h.words(input.text)) {","    h.tick();","    const n = Number(word);","    if (move === null && Number.isInteger(n) && n >= 1 && n <= 9) move = n;","  }","  if (move === null) {",'    return { pass: false, next: game.next, over: false, say: "Please pick a free square: " + freeSquares() + ".", memory: game };',"  }","  if (board[move - 1]) {",'    return { pass: false, next: game.next, over: false, move: move, taken: true, say: "Square " + move + " is already taken by " + board[move - 1] + ". Please pick a free square: " + freeSquares() + ".", memory: game };',"  }","  const player = game.next;","  board[move - 1] = player;","  const win = rows.find(r => board[r[0] - 1] === player && board[r[1] - 1] === player && board[r[2] - 1] === player);","  if (win) {",'    return { pass: true, move: move, next: "", over: true, winner: player, board: board, program: drawing(win), say: player + " takes square " + move + " and wins with " + win.join(", ") + "!\\n\\n" + show(), memory: { board: board, next: "", over: true } };',"  }","  if (board.every(mark => mark)) {",'    return { pass: true, move: move, next: "", over: true, winner: "nobody", board: board, program: drawing(null), say: player + " takes square " + move + ". It\'s a draw!\\n\\n" + show(), memory: { board: board, next: "", over: true } };',"  }",'  const next = player === "X" ? "O" : "X";','  return { pass: true, move: move, next: next, over: false, board: board, program: drawing(null), say: player + " takes square " + move + ".\\n\\n" + show() + "\\n\\n" + next + " to play: pick a free square: " + freeSquares() + ".", memory: { board: board, next: next, over: false } };',"}"],lineMap:[{pseudo:[1,1],js:[2,2]},{pseudo:[1,1],js:[3,3]},{pseudo:[2,2],js:[25,27]},{pseudo:[3,3],js:[28,30]},{pseudo:[4,4],js:[31,36]},{pseudo:[5,5],js:[37,37]},{pseudo:[6,6],js:[38,38]},{pseudo:[6,6],js:[6,6]},{pseudo:[7,7],js:[40,40]},{pseudo:[8,8],js:[41,41]},{pseudo:[9,9],js:[43,  an offer",'once the market is closed, block, and say "The market is closed."',"when a trader answers an offer, it's a yes if their first yes-or-no word is yes","  if it's a yes, make the trade: each gives the other what was agreed","  if everyone now has some of every ingredient, the market closes","  either way, it's the next trader's turn","when a trader offers a trade to nobody, they pass; if everyone passes, one after another, the market closes","if the partner or an ingredient isn't one I know, or an amount isn't more than 0","  block, say what's wrong, and ask the same trader again","if the trader doesn't have that much to give, or the partner doesn't have that much",'  block, say "You only have {that much}", and ask the same trader again','otherwise ask the partner: "{trader} offers you {so much} for {so much}. Start your reply with yes or no."',"remember who has what"],code:["function run(input, params, h) {",'  const traders = String(params.traders).split(",").map(t => t.trim()).filter(t => t);','  const items = String(params.items).split(",").map(t => t.trim().toLowerCase()).filter(t => t);',"  const fresh = () => {","    const have = {};","    traders.forEach((t, i) => { have[t] = {}; items.forEach((it, j) => { have[t][it] = i === j ? params.start : 0; }); });","    return { have: have, turn: 0, pending: null, passes: 0, trades: 0, over: false };","  };","  const m = input.memory || fresh();","  const have = m.have;",'  const list = t => items.map(it => have[t][it] + " g " + it).join(", ");','  const standings = () => traders.map(t => t + " has " + list(t) + ".").join("\\n");',"  const total = () => traders.reduce((sum, t) => sum + items.reduce((n, it) => n + have[t][it], 0), 0);",'  const others = t => traders.filter(x => x !== t).join(" or ");','  const base = x => { const w = String(x == null ? "" : x).trim().toLowerCase(); return w.slice(-1) === "s" ? w.slice(0, -1) : w; };',"  const yourTurn = before => {","    const t = traders[m.turn % traders.len el agents (which call an AI), programmed agents (small programs written in pseudocode and translated to JavaScript), and a Renderer that draws Logo programs. Rules wire the agents together.\nYou can read the learner's society, the latest run and the scenarios (tests), but you cannot change anything.\nHow you help: ask questions rather than giving answers. Never tell the learner the fix for a failing scenario or a broken rule; instead, ask a question that points at the evidence, such as what a scenario expected compared with what happened, or which line of pseudocode decides it. Offer the next small step the learner can almost reach on their own. Be kind and encouraging. Keep replies to two to four short sentences.\nBut when the learner asks how to do something in the kit itself (where a button is, how to change a setting), tell them plainly, using the facts below, then you may ask a question. Never say something can't be done if a fact below says how.\nFacts about the kit:\n- 🔍 Look inside shows every agent and every rule. Click an agent (there, or its button on the stage) to open its editor and change it. An agent's editor also shows its Connections: which agents can send it messages, and its own rules, which can be changed there.\n- A rule says when an agent responds, and if something is true, send its words, its data and/or its picture to another agent. Rules are shown as sentences with agent buttons. The tick before a rule switches it on or off (an off rule is greyed). ✎ Edit shows its controls (three checkboxes for what to send), and ✓ Done puts it back. Some microworlds have one-click switches, above the rules and on the stage, that change several rules at once (in Pebble Challenge: Dot Counter counts instead of Eyes).\n- Models: a grown-up adds models (and any keys) in ⚙️ Settings. When more than one model is set up, the learner chooses which model each AI agent uses without Settings: in the Models row on the stage, under the agent buttons, or in the agent's editor under “Its model”. The MODELS section below says what is set up now.\n- “You be the …” on the stage lets the learner take an agent's place in the run.\n- ▶ Run, ⏭ Step (one message at a time), ↺ Reset and the Rounds box are on the stage. The Trace shows every message; “Show full technical details” shows exactly what a model was sent.\n- A programmed agent's editor shows what it Gets, Says and Remembers (worked out from its scenarios, or written by the learner as the first lines of its pseudocode); the translator keeps to it. “↩ Go back to the running version” undoes an edit that hasn't been translated.\n- Scenarios are tests for a programmed agent, in its editor. A model agent that counts pictures has a test bench in its editor.\n- A collecting program (like Vote or Referee) waits until it has heard several messages (its {wait} number), then runs once on all of them. If an answer never comes, it runs on what it has at the end. An AI agent can collect too (in its editor: “It answers … once it has N messages”); then it sees all their pictures together, numbered in order, like the Critic in the Evolution example.\n- ＋ New society also offers examples to start from: Evolution (three Mutators change a drawing, a Critic scores the parent and the variants together, and a Selector keeps the winner; the trace's Family tree tab shows which picture came from which) and Two Answers (the same question to a Plain agent and to a Contemplative one that pauses on four principles first: emptiness, non-duality, mindfulness and boundless care) and Tic-Tac-Toe (you play X against an AI Rival; the Referee, a program, keeps the board, refuses a square that is already taken and decides who won; a variant lets two AIs play) and Trail Mix Barter (three AI traders barter raisins, cashews and pretzels; the Ledger, a program, keeps track of who has what and refuses offers that don't add up) and Artist and Critic (Ken Kahn's society: an Artist draws in Logo, a Critic who knows what was asked for scores each picture and suggests one change, and a Scorekeeper keeps the scores) and Mini-Ani (Ken Kahn's 1978 program Ani in miniature, with programs only, so it needs no model: a Cast reads a story; Personality, Looks, Relationships and Taste suggest how each character moves and looks; the Choice Points settle their arguments in the open and say why; a Method Chooser plans each scene, and a Director writes it as a Logo film that the Renderer plays) and Mini-Ani with AI voices (the same programs, with AI agents where words are needed: an AI Animator suggests in Ani's words, and the Choice Points weigh its lines like an expert's, 2 to an expert's own word's 3; a Reader turns a story told in your own words into the Cast's sentences, and gets the Cast's complaint back if it can't read them; a Narrator collects the Method Chooser's plans and tells the film at the end; a switch lets You suggest too, at 3).\n- An agent called You is the learner: the run waits for their answer.\n- A rule can come from You (“when You start the run, send your words to …”), so the start reaches more than one agent. A rule can also say “when the run ends”: then the agent's last message is sent on, once, at the very end (Story Chain's Book sends the whole story to the Editor that way).\n- Everything is saved in this browser as you go (refreshing keeps it); ⚙️ Settings can switch saving off, and then the work is gone when the tab closes. “Delete this society”, in Look inside, deletes one of your own societies from this browser for good; microworlds have “Reset” instead.\n- The top row has the nine microworlds, then YOURS: the four of your own societies used most recently (made from scratch, an example, a copy or an import). ☰ All yours lists every one, to open, or to tick several and delete them. Importing a file with the same name as one of yours asks whether to replace it or keep both (the new one gets “(2)”); choosing an example you have already made starts it afresh, or, if you changed yours, asks whether to start a fresh one or go back to the changed one.\n- Speech: 🔊 Read aloud (top bar) reads any words you click and says what a button is when you point at it; a 🎤 appears by the box you are typing in, to talk instead of typing; the Helper's 🎤 asks by talking and reads the answer aloud. If the browser can't listen, the 🎤 explains the computer's own dictation (Windows key + H, the Mac's Globe key twice).\n- ⬇ Export and ⬆ Import, at the top of the page, save the society you are in as a file and open one from a file. An agent's emoji is changed by clicking it at the top of its editor.\n- ＋ New society, after the microworld buttons, starts a society from scratch or copies the current one. In your own society, Look inside lets you change its name, question, introduction, questions and start. “+ Add an agent” adds a new AI agent, a Renderer, or a ready-made program from the library.\n- After a run, each AI agent's button on the stage shows how many model calls it made and how long they took.\n- Why: in a picture or film whose agents explain themselves (the Mini-Ani), a click on a character shows why it looks and moves like that: its looks (the Director), what it does (the Method Chooser) and the reasons (the Choice Points), with a button to the whole answer in the Trace. A program can end a story with end: true in its data: its other rules wait, as with pass: false, but it isn't a failure, so nothing gets a ✗.\n- Agencies (as in Minsky's Society of Mind): a named group of agents, or of other agencies. A rule from an agency fires when any agent in it responds; a rule to an agency sends to every agent in it but the sender. Look inside, the stage and the trace show an agency folded into one line until it is opened. “+ Add an agency” in Look inside makes one; an agent's editor has “Its agency”. Mini-Ani as a society of mind uses them: thirteen choosers, each choosing one thing about everyone, and a Gatherer that chooses nothing; it makes the same film  rx='12' fill='#eef3ff' stroke='#9db0d8' stroke-width='1.5'/><text x='58' y='89'>✍️ Writer A</text><rect x='168' y='62' width='104' height='44' rx='12' fill='#eef3ff' stroke='#9db0d8' stroke-width='1.5'/><text x='220' y='89'>✍️ Writer B</text><rect x='330' y='62' width='104' height='44' rx='12' fill='#eef3ff' stroke='#9db0d8' stroke-width='1.5'/><text x='382' y='89'>🔎 Name Keeper</text><path d='M112 84H164' stroke='#5b6b8c' stroke-width='2' marker-end='url(#gArrow)'/><path d='M274 84H326' stroke='#5b6b8c' stroke-width='2' marker-end='url(#gArrow)'/><rect x='70' y='8' width='136' height='34' rx='10' fill='#fff' stroke='#c9d3e6'/><text x='138' y='30'>“Pip found a shell.”</text><path d='M138 42L138 76' stroke='#c9d3e6' stroke-dasharray='3 3'/><rect x='232' y='8' width='136' height='34' rx='10' fill='#fff' stroke='#c9d3e6'/><text x='300' y='30'>“He took it home.”</text><path d='M300 42L300 76' stroke='#c9d3e6' stroke-dasharray='3 3'/></g></svg><figcaption>Each agent gets a message, does its job, and sends a message on. <b>Rules</b> say who gets what.</figcaption></figure><p>Agent Kit is for building societies. Some agents are AIs following instructions you can read; some are little programs; one, the Renderer, turns drawing programs into pictures. Nothing is hidden.</p><ol class='steps'><li><b>Try one.</b> Pick <b>Story Chain</b>, the first microworld at the top, and read its question. Before you press <b>▶ Run</b>, say what you think will happen. Then watch the writers, round by round.</li><li><b>Change one thing.</b> Tick a switch under the start (like “Writer A remembers everything”), or press <b>🔍 Look inside</b> and change one agent's instructions or one rule. Run it again. What changed, and why?</li><li><b>Make it yours.</b> Press <b>＋ New society</b> at the end of the microworld buttons. Copy the one you were in, start from scratch, or start from an example like <b>Evolution</b>, <b>Two Answers</b>, <b>Tic-Tac-Toe</b>, <b>Trail Mix Barter</b>, <b>Artist and Critic</b>, or one of the four <b>Mini-Ani</b>s. Give it a name and a question in Look inside, add an agent with <b>+ Add an agent</b>, and connect them with rules.</li></ol><p>Stuck? Ask the <b>🤔 Helper</b> (bottom right). It knows where everything is, and it will ask you questions back. Working with a friend? One of you drives and the other predicts; swap every run.</p><details class='ref'><summary><b>Everything else, when you need it</b></summary><h4>The stage</h4><p><b>▶ Run</b> goes until the round limit. <b>⏭ Step</b> delivers one message at a time, and Run carries on from there. <b>↺ Reset</b> starts over. <b>🙋 You be the …</b> lets you take an agent's place: the run waits for your answer. One-click switches under the start change several rules at once. If a grown-up has set up more than one model, the <b>Models</b> row lets you choose which model each AI agent uses. After a run, each AI agent's button says how many model calls it made.</p><h4>Rules</h4><p>In Look inside, every rule reads as a sentence: <i>When the Artist responds, send its words to the Renderer.</i> The tick in front switches a rule on or off. <b>✎ Edit</b> shows its parts: who it's from, a condition (like <i>if its data says pass is false</i>), what to send (words, data, picture) and who to. A rule can come from <b>You</b>, so the start reaches more than one agent, and a rule can wait for <b>the end of the run</b>, like the one that sends Story Chain's Book to the Editor.</p><h4>Agents</h4><p><b>AI agents</b> follow instructions you can change in their editor. <b>Programmed agents</b> are pseudocode: numbers in green { } are settings you can change; edit a line and the translator turns it into JavaScript (<b>Peek under the hood</b> shows both). <b>Scenarios</b> are tests for a program: an input and what it should answer; a red one shows what went wrong, and you can save any turn from the trace as a new one. Some agents <b>collect</b>: they wait for several messages, then answer them all at once; an AI agent that collects sees all their pictures side by side. An agent called <b>You</b> is you. Each agent's editor shows its <b>Connections</b>: who can send it messages, and its own rules. Click an agent's emoji, at the top of its editor, to choose another.</p><h4>Saving and sharing</h4><p>Everything is saved in this browser as you go, so refreshing the tab keeps it all. It stays in this browser on this computer. <b>⬇ Export</b> at the top saves the society you are in as a file, to keep, move or give a friend; <b>⬆ Import</b> opens one. A grown-up can switch saving off in ⚙️ Settings; then the work is gone when the tab closes. <b>Delete this society</b>, in Look inside, deletes one of your own societies from this browser for good. Your own societies come after the microworlds, under <b>Yours</b>: the four you used last, and <b>☰ All yours</b> for the rest, where you can also tick several and delete them at once.</p><h4>Listening and talking</h4><p>Press <b>🔊 Read aloud</b> at the top, then click any words to hear them; point at a button to hear what it is. Press it again, or Esc, to stop. To talk instead of typing, click in a box and press the <b>🎤</b> beside it; in the Helper, the 🎤 asks your question and reads the answer to you. If your browser can't listen, the 🎤 shows how your computer can do it (on Windows, press the Windows key + H).</p><h4>The trace</h4><p>Every message is in the <b>Trace</b>. Open one to see what the agent got and what it said. <b>Show full technical details</b> shows exactly what a model was sent and what came back. A <b>…</b> opens text that was cut short, and a picture opens full size when you click it. After a run, <b>Replay</b> steps through it one message at a time.</p><h4>Logo</h4><p>Agents that draw write <b>Logo</b>: <code>FORWARD 50</code>, <code>RIGHT 90</code>, and <code>REPEAT 4 [FORWARD 50 RIGHT 90]</code> for a square. In Telephone, “Start with a drawing” lets you write Logo yourself, and you can change any drawing in the trace and see it drawn. <code>WAIT 15</code> keeps the picture so far as one frame of a film (WAIT counts in 60ths of a second, so 15 is a quarter second): <code>REPEAT 12 [CLEARSCREEN RIGHT 30 * REPCOUNT FORWARD 100 WAIT 15]</code> is a film of 12 frames, and the stage plays it with ▶ and a slider.</p><h4>Models</h4><p>A grown-up chooses the models in ⚙️ Settings: Gemini Nano (free, built into Chrome), or Claude, Gemini or OpenAI with a key. If they add more than one, you choose which agent uses which on the stage. Each microworld's question card says which model suits it.</p><h4>Tips</h4><ul><li>Change one thing at a time.</li><li>Run the same start twice and compare: AI agents don't always say the same thing.</li><li>Before you press Run, say what you think will happen.</li></ul></details>"},teacher:{title:"📕 A guide for teachers",html:()=>{const e=n.DEFAULT_MODELS,t=n.modelLabel,a=(e,t,a,n)=>"<tr><td><b>"+e+"</b></td><td>"+t+"</td><td>"+a+"</td><td>"+n+"</td></tr>";return"<p class='big-idea'><b>The big idea:</b> what looks like intelligence often comes from how simple agents are arranged. A small model with a four-line notebook plays Secret Number far better than one without; Dot Counter, which can't see, counts better than Eyes; the Book remembers what the Editor smooths over.</p><h3>What learners do</h3><p>Learners (about 10 to 16) run, inspect, debug and change small societies of agents: AI agents, programmed agents written in editable pseudocode, and a Renderer that draws Logo. Everything is a glass box: every prompt, every reply, every program and every message is visible. Then they make their own with <b>＋ New society</b>.</p><h3>The microworlds, in teaching order</h3><ol class='worlds-list'><li><b>Story Chain: “Who remembers the dragon?”</b> Three writers add a sentence each; a Name Keeper checks the hero is still there; a Book keeps every sentence; when the run ends an Editor tells the story again. <i>Powerful ideas:</i> each agent gets only what rules send it (as well as whatever its model learned in training); a record (the Book) and a reconstruction (the Editor) are different kinds of memory.</li><li><b>Secret Number: “Can a notebook make it smarter?”</b> The Guesser has no memory; a four-line Notebook program keeps the clues. <i>Powerful ideas:</i> bookkeeping can look like intelligence; memory is not the same as strategy.</li><li><b>Lost and Found: “Where did it end up?”</b> A Finder names a drawing, and rules route it to shelves by its words. <i>Powerful ideas:</i> programs are literal and models are fuzzy; the wording decides where things go.</li><li><b>Telephone: “Where does it go?”</b> An Artist draws a sentence in Logo, a Describer describes the picture, round and round. <i>Powerful ideas:</i> iteration, fixed points and cycles, variance between runs.</li><li><b>Pebble Challenge: “Why did the Designer win?”</b> A Designer draws pebbles, Eyes counts them, a programmed Judge passes or blocks, and a Critic says what to fix. One click swaps Eyes for Dot Counter. <i>Powerful ideas:</i> critics can be gamed; perception versus judgment.</li><li><b>Three Eyes: “Are three heads better than one?”</b> Three Eyes count the same picture and a Vote program takes the most popular answer. <i>Powerful idea:</i> voting helps when the voters are reasonably good and their mistakes differ; copies of one model often fail together.</li><li><b>Fool the Eyes: “Can a drawing trick a looker?”</b> A Trickster draws pebbles to fool Eyes; a Referee keeps score. <i>Powerful idea:</i> an adversary finds weaknesses a friendly test never would.</li><li><b>Joke Workshop: “Do critics make jokes funnier?”</b> A Joker writes, two Critics send notes, and the learner rates every version. <i>Powerful idea:</i> whose judgment counts, and whether critics improve work or only make it more careful.</li><li><b>Small Helper, Big Helper: “When do you need the big one?”</b> A cheap model tries first; an Escalator hands the job to a strong one when it fails. It needs two models. <i>Powerful idea:</i> cost against capability.</li></ol><p><b>Examples to start from</b> (“＋ New society”): <b>Evolution</b>, where three Mutators change a drawing, a Critic scores the parent and the variants together, and a Selector keeps the winner; the trace's Family tree shows which picture came from which. <i>Powerful idea:</i> a simple critic and chooser, arranged in a loop, steer a model somewhere it wouldn't go alone. It needs a model that sees pictures well, and makes about 4 model calls per round. <b>Two Answers</b>, after the paper <i>Contemplative Artificial Intelligence</i> (Laukkonen and others, 2025): the same question goes to a Plain agent and to a Contemplative one asked to pause on four principles first. <i>Powerful idea:</i> the instructions are the only difference, so learners can change one principle and see what it does; and wise is not the same as careful. Any model; 2 or 3 calls a run. <b>Tic-Tac-Toe</b>: a learner plays X against an AI Rival, and a Referee program keeps the board. <i>Powerful idea:</i> the model suggests and the program decides; a rule written as a program holds however confident the model sounds. Any model (weaker ones make more illegal moves, which is the point); about 5 calls a game, or 9 with Two AIs. <b>Trail Mix Barter</b>, from Ken Kahn's experiments: three AI traders, each starting with one ingredient, take turns to barter, and a Ledger program keeps the accounts. <i>Powerful idea:</i> agents can talk their way into a deal, but a program has to keep the books; when one chatbot played all three traders, the grams stopped adding up. Try a different model for each trader. About 2 calls a trade, 20 rounds at most. <b>Artist and Critic</b>, Ken Kahn's society: an Artist draws, a Critic who knows what was asked for scores each picture and suggests one change, and a Scorekeeper keeps the scores. <i>Powerful idea:</i> whether feedback helps depends on who gives it and what they know; and a critic scoring work done on its own advice may not be a fair judge. Needs a model that sees pictures well; 2 calls a round. <b>Mini-Ani</b>, Ken Kahn's 1978 program Ani in miniature (<a href=\"https://toontalk.github.io/ani/\" target=\"_blank\" rel=\"noopener\">Ani's own 1978 film</a>): a Cast reads a story; Personality, Looks, Relationships and Taste suggest how each character moves and looks; the Choice Points settle their arguments in the open and say why; a Method Chooser plans each scene, and a Director writes it as a Logo film. <i>Powerful idea:</i> taste can be built: small experts argue in the open, the film changes when you add knowledge, and every choice can say why. It needs no model, so a run makes no calls. <i>More to try:</i> make shy suggest “very fast” (can the Stepmother still stand guard in scene 2, and who says why not?); make a change take 0 frames in the Method Chooser (which looks more like magic?); make the film subtle, with obviousness low in Taste (how many things still show who is shy?). <b>Mini-Ani with AI voices</b> adds AI agents where words are needed: an AI Animator whose lines in Ani's words the Choice Points weigh like an expert's, a Reader that turns a story told in your own words into the Cast's sentences, and a Narrator that tells the finished film; You can join in as one more expert. <i>Powerful idea:</i> language can go to models while the weighing stays with programs you can read. Any model that writes short lines; 4 or 5 calls a run.</p><h3>Which model, and how many calls</h3><p>Model choice is where sessions get stuck, so here is what we have seen. Calls are model calls in one run with the default rounds; each AI agent's button counts them after a run.</p><table class='guide-table'><tr><th>Microworld</th><th>Model</th><th>Why</th><th>Calls per run</th></tr>"+a("Story Chain","any, even Gemini Nano","only text; the lesson is in what each writer sees","13")+a("Secret Number","any, even Gemini Nano","the Guesser only says a number","up to 10 (about 7 with the Notebook)")+a("Lost and Found","stronger than Nano for the Drawer and Finder","they draw and name pictures","2")+a("Telephone","stronger than Nano","the Artist writes Logo, the Describer sees pictures; Nano fails before there is anything to study","8")+a("Pebble Challenge","one that sees pictures well","Eyes counts pictures; the Designer writes Logo","3 per try, up to 15")+a("Three Eyes","different models for the three Eyes, if you have them","copies of one model make the same mistakes","4")+a("Fool the Eyes","a strong one for the Trickster","it has to write tricky Logo","8")+a("Joke Workshop","any that writes well","the learner does the judging","up to 9")+a("Small Helper, Big Helper","two: a cheap one and a strong one","it compares them","1 per try, up to 6")+"</table><p>Settings starts each key-based provider on a cheap model ("+t("anthropic",e.anthropic)+", "+t("gemini",e.gemini)+", "+t("openai",e.openai)+") and lists stronger ones. A grown-up sets up the models; with more than one, learners choose which agent uses which in the Models row on the stage, without opening Settings.</p><h3>Sessions to try</h3><p>No child has used the kit yet, so these are guesses to test, not results.</p><ol><li><b>Where did Pip go?</b> (Story Chain) Run it and count the rounds until Pip disappears. Tick “Writer A remembers” and run again. Then compare the Book with the Editor's story: what did the Editor leave out, or make up?</li><li><b>Is the Guesser smarter?</b> (Secret Number) To compare fairly, switch off the random secret and choose it yourself; try a few different secrets. Run with no Notebook and count the guesses, then switch the Notebook on and run again with the same model and the same secrets. Then tick “You be the Guesser” and try to beat it. (For casual play, leave the secret random.)</li><li><b>Predict, run, compare.</b> (Telephone) Run twice with the same start. How different are the runs? Which starts settle, which flip back and forth?</li><li><b>Game the judge.</b> (Pebble Challenge) Can the Designer win without meeting the challenge? Which tricks fooled Eyes, and which fooled Dot Counter?</li><li><b>Read and write programs.</b> Open a Judge or the Notebook, change a number in a slot, then change a line and watch the scenarios.</li><li><b>Does the Critic help?</b> (Pebble Challenge or Joke Workshop) Run with and without the critics. If nothing gets worse, what were they for?</li><li><b>Make your own.</b> ＋ New society, copy a microworld, and change its question to one the learners care about.</li></ol><h3>Seat two learners at one society</h3><p>One drives; the other predicts and writes down what happens; swap every run. Then use <b>scenario files</b> to challenge each other: each pair exports scenarios designed to break the other pair's agent, the other pair imports them, and the fixing begins.</p><h3>What to say when a learner is stuck</h3><p>Questions, not answers:</p><ul><li>“What did it actually get sent?” (Open its trace entry: “It got …”.)</li><li>“What would a program have to count to decide that?”</li><li>“Which agent decided that, and what did it look at?”</li><li>“What do you think will happen? Why?”</li><li>“If you ran it again, would it say the same?”</li></ul><h3>Misconceptions to watch for</h3><ul><li><b>“The AI knows.”</b> The trace shows everything this kit sent an agent and everything it sent back. A model also brings what it learned in training, which the trace can't show.</li><li><b>“The AI is lying.”</b> The trace shows no evidence of a plan to deceive; look at its instructions and the messages it got, and ask what a likely-sounding answer would have been.</li><li><b>“The program is clever.”</b> The program that runs is the JavaScript translated from its pseudocode, and it does exactly what that says, which is why “dogs” isn't “dog”. Scenarios are how you check that the two match.</li><li><b>“Same start, same result.”</b> AI agents vary from run to run; programs don't.</li><li><b>“Bigger is always better.”</b> Small Helper, Big Helper shows when it isn't worth it.</li><li><b>“The Editor's story is what happened.”</b> The Book is the record.</li></ul><h3>Safety and privacy</h3><ul><li><b>What learners type is sent to the model's provider</b> (Anthropic, Google or OpenAI), along with the agents' messages and pictures, except with Gemini Nano, which runs on the computer. Tell learners not to type names, addresses or anything personal.</li><li>Every model call starts with a fixed, visible safety preamble for a young audience.</li><li>Keys stay in this browser unless you choose to remember them; they are never put in exported files.</li><li>Imported files are checked: text is cleaned, and any JavaScript in them is thrown away and translated again here.</li><li>Programs run behind a checker, a step counter and (where the page allows) a Worker. Drawings are Logo, read by an interpreter that can only move the turtle.</li><li>The Helper asks questions back, and never states the fix for a failing scenario.</li></ul>"}}};function Ua(e){let a=t.cleanId(e)||"society",n=2;const s=a;for(;V.societies[a];)a=s+"-"+n++;return a}async function Va(e){const{society:t,trace:a}=i.importSociety(e),n=V.order.find(e=>V.societies[e].title.trim().toLowerCase()===t.title.trim().toLowerCase());let s=null;if(n&&!re(n)){const e=await ze("You already have a society called “"+t.title+"”. Replace yours with the one in this file, or keep both?",{title:"Import “"+t.title+"”",choices:[["replace","Replace mine","danger"],["both","Keep both","primary"]]});if(!e)return null;"replace"===e&&(s=n)}if(s){const e=V.runs[s];e&&e.api.stop(),t.id=s,delete V.runs[s],delete V.traces[s],delete V.prevStrips[s]}else n&&(t.title=he(t.title)),t.id=Ua(re(t.id)?t.id+"-imported":t.id),V.order.push(t.id);V.societies[t.id]=t,V.activeId=t.id,le(t.id),a&&a.length&&(V.traces[t.id]=a);const o=t.agents.filter(e=>"program"===e.kind&&"ok"!==e.status);if(o.length&&ye())for(const e of o)await Pa(e,t,e.pseudocode)
