<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Kit</title>
<style>
/* ===== SECTION: STYLES ===== */
:root{
  --paper:#F4F7FB; --grid:#E4EAF2; --card:#FFFFFF; --ink:#1D2A44; --ink-soft:#56627C; --ink-faint:#8A94AB;
  --line:#E1E7F0; --line-strong:#C8D2E0;
  --model:#6655F0; --model-bg:#EFEDFF; --program:#12876A; --program-bg:#E2F5EE; --renderer:#B96F07; --renderer-bg:#FFF2D9;
  --gate:#D9442E; --gate-bg:#FFEAE5; --ok:#178A50; --ok-bg:#E1F5E9; --bad:#C8372D; --bad-bg:#FDEBE9; --warn:#9A6212; --warn-bg:#FFF4D6;
  --accent:#2563EB; --accent-bg:#E8F0FE; --focus:#F5B400;
  --display:"Nunito","Segoe UI Rounded",ui-rounded,"Trebuchet MS",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"Cascadia Code",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.45;background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:1px}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.2}
pre,code,.mono,textarea.code,.pseudo,.codecol,.slot{font-family:var(--mono);font-variant-ligatures:none}
.hidden{display:none!important}
.muted{color:var(--ink-soft)}
.faint{color:var(--ink-faint)}
.small{font-size:12.5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.grow{flex:1}
.stack{display:flex;flex-direction:column;gap:10px}

/* top bar */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 18px;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:900;font-size:21px;letter-spacing:.2px;white-space:nowrap}
.brand .logo{width:30px;height:30px}
.worlds{display:flex;gap:6px;flex-wrap:wrap}
.world{border:1.5px solid var(--line-strong);background:#fff;border-radius:999px;padding:6px 14px;font-family:var(--display);font-weight:800;font-size:14px;color:var(--ink-soft)}
.world:hover{border-color:var(--ink-soft)}
.world.on{background:var(--ink);border-color:var(--ink);color:#fff}
.world .q{font-weight:600;opacity:.75;margin-left:6px;font-size:12.5px}
.top-actions{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mode-chip{border:1.5px solid var(--line-strong);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;display:flex;gap:6px;align-items:center}
.mode-chip .dot{width:9px;height:9px;border-radius:50%;background:var(--ink-faint)}
.mode-chip.pretend .dot{background:var(--renderer)}
.mode-chip.live .dot{background:var(--ok)}
.btn{border:1.5px solid var(--line-strong);background:#fff;border-radius:10px;padding:7px 13px;font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.btn:hover:not(:disabled){border-color:var(--ink-soft)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.go{background:var(--ok);border-color:var(--ok);color:#fff;font-size:15px;padding:9px 18px}
.btn.danger{color:var(--bad);border-color:#F2BDB8;background:var(--bad-bg)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover:not(:disabled){background:#EEF2F8;border-color:transparent}
.btn.tiny{padding:3px 8px;font-size:12px;border-radius:8px}
.icon-btn{border:none;background:transparent;font-size:18px;line-height:1;padding:6px;border-radius:8px;color:var(--ink-soft)}
.icon-btn:hover{background:#EEF2F8}

/* banners */
.banners{padding:0 18px}
.banner{margin:10px auto 0;max-width:1500px;display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:12px;border:1.5px solid;font-size:13.5px}
.banner.warn{background:var(--warn-bg);border-color:#F1D48A;color:#6B4A0A}
.banner.bad{background:var(--bad-bg);border-color:#F2BDB8;color:#7A1F17}
.banner.info{background:var(--accent-bg);border-color:#BFD2FB;color:#1E3F8A}
.banner .grow{min-width:200px}
.banner b{font-weight:800}

/* layout */
.layout{max-width:1560px;margin:0 auto;padding:14px 18px 60px;display:grid;grid-template-columns:minmax(300px,380px) minmax(380px,1fr) minmax(340px,440px);gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.mobile-tabs{display:none}
.layout.inside-open{grid-template-columns:minmax(360px,470px) minmax(380px,1fr) minmax(320px,400px)}
@media (max-width:1240px){.layout,.layout.inside-open{grid-template-columns:minmax(300px,420px) 1fr}.col.right{grid-column:1 / -1}}
@media (max-width:820px){
  .layout,.layout.inside-open{grid-template-columns:1fr;padding:10px 12px 70px}
  .col.right{grid-column:auto}
  .mobile-tabs{display:flex;position:sticky;top:0;z-index:25;gap:6px;padding:8px 12px;background:rgba(255,255,255,.95);border-bottom:1px solid var(--line)}
  .mobile-tabs button{flex:1}
  body[data-tab="stage"] .col.left,body[data-tab="stage"] .col.right{display:none}
  body[data-tab="inside"] .col.center,body[data-tab="inside"] .col.right{display:none}
  body[data-tab="trace"] .col.left,body[data-tab="trace"] .col.center{display:none}
  .topbar{position:static}
}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 15px;box-shadow:0 1px 0 rgba(29,42,68,.04)}
.card h3{font-size:17px;margin-bottom:8px}
.card-title{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.card-title h3{margin:0}

/* question card */
.qcard{background:linear-gradient(180deg,#FFFDF5,#fff);border-color:#F0E2B6}
.qcard .big-q{font-family:var(--display);font-weight:900;font-size:22px;margin:2px 0 8px}
.qcard ul{margin:0;padding-left:20px}
.qcard li{margin:5px 0}
.qcard .kicker{font-size:11.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:#A07A12}

/* badges and agent chips */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;border-radius:999px;padding:2px 8px;letter-spacing:.2px;white-space:nowrap}
.badge.model{background:var(--model-bg);color:var(--model)}
.badge.program{background:var(--program-bg);color:var(--program)}
.badge.renderer{background:var(--renderer-bg);color:var(--renderer)}
.badge.gate{background:var(--gate-bg);color:var(--gate)}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.bad{background:var(--bad-bg);color:var(--bad)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.plain{background:#EEF2F8;color:var(--ink-soft)}
.kind-model{--k:var(--model);--kb:var(--model-bg)}
.kind-program{--k:var(--program);--kb:var(--program-bg)}
.kind-renderer{--k:var(--renderer);--kb:var(--renderer-bg)}

/* stage */
.stage .start-tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.seg{border:1.5px solid var(--line-strong);background:#fff;border-radius:999px;padding:5px 12px;font-weight:700;font-size:13px;color:var(--ink-soft)}
.seg.on{background:var(--ink);border-color:var(--ink);color:#fff}
.field{width:100%;border:1.5px solid var(--line-strong);border-radius:10px;padding:8px 10px;background:#FCFDFF}
textarea.field{resize:vertical;min-height:70px}
textarea.code,.code-input{font-family:var(--mono);font-size:12.5px;line-height:1.5}
.examples{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.example{border:1.5px dashed var(--line-strong);background:#FBFCFE;border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--ink-soft)}
.example:hover{border-style:solid;color:var(--ink)}
.challenges{display:flex;gap:6px;flex-wrap:wrap}
.challenge{border:1.5px solid var(--line-strong);background:#fff;border-radius:12px;padding:6px 10px;font-weight:700;font-size:13px;text-align:left}
.challenge.on{border-color:var(--accent);background:var(--accent-bg);color:#1846B8}
.challenge .who{display:block;font-weight:600;font-size:11px;color:var(--ink-faint)}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1.5px dashed var(--line)}
.controls .num{width:58px;padding:5px 7px;border:1.5px solid var(--line-strong);border-radius:8px;text-align:center}
.status-line{font-size:13.5px;color:var(--ink-soft);min-height:20px;margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.status-line .pulse{width:9px;height:9px;border-radius:50%;background:var(--ok);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
.agent-strip{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px}
.achip{display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px 4px 7px;font-size:12.5px;font-weight:700;color:var(--ink-soft);transition:transform .15s,box-shadow .15s}
.achip .e{font-size:15px}
.achip.kind-model{border-color:#D8D2FF}
.achip.kind-program{border-color:#BFE8D8}
.achip.kind-renderer{border-color:#F4DBA8}
.achip.active{color:var(--ink);background:var(--kb);border-color:var(--k);box-shadow:0 0 0 3px color-mix(in srgb,var(--k) 22%,transparent);transform:translateY(-1px)}
.achip .mdl{font-size:10.5px;font-weight:600;color:var(--ink-faint);margin-left:2px}
.model-note{margin:10px 0 0;font-size:13px;color:var(--ink-soft)}
.extra-list{display:grid;gap:6px;margin:6px 0 8px}.extra{display:flex;flex-wrap:wrap;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:10px;padding:6px 8px;font-size:13px}
.add-model{flex-wrap:wrap;gap:6px}.add-model .field{max-width:260px}
.bubbles.wide{min-height:60px}
.send-group{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex-wrap:wrap}.send-warn{color:var(--bad);font-size:12px;font-weight:700;white-space:normal}
.rule-read .rule-on{flex:none;margin-top:6px}
.variants-inside{display:grid;gap:3px;margin:6px 0 8px;padding:6px 9px;border-radius:10px;background:var(--accent-bg)}.send-parts{display:inline-flex;gap:3px}.sendp{display:inline-flex;align-items:center;gap:3px;border:1.5px solid var(--line);border-radius:999px;padding:1px 8px 1px 5px;font-size:12px;cursor:pointer;background:#fff;color:var(--ink-soft)}.sendp.on{border-color:var(--accent);background:var(--accent-bg);color:var(--ink)}.sendp input{margin:0}
.models-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:8px 0 2px}.mpick{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;color:var(--ink-soft)}.mpick select{font-size:12.5px;max-width:200px}
.conn-in{display:flex;flex-wrap:wrap;align-items:center;gap:6px}.achip.off{opacity:.55}.achip.you{border-color:#F2C9A8}
.rule-read{display:flex;align-items:flex-start;gap:8px;border:1.5px solid var(--line);border-radius:12px;padding:7px 10px;background:#fff;font-size:13.5px;line-height:1.85}.rule-read .sentence{flex:1}.rule-read .achip{vertical-align:middle;margin:0 1px;padding:0 8px 0 5px;font-size:12.5px;line-height:1.6}.rule-read .achip .e{font-size:13px}.rule-read.off .sentence{opacity:.55}.rule-read .btn{flex:none;margin-top:3px}
.rule-editing{border:1.5px dashed var(--accent);border-radius:12px;padding:6px}.rule-editing .rule{border:0;margin:0}
.achip .calls{font-size:10.5px;font-weight:600;color:var(--ink-faint);margin-left:3px}
.yt-ask{margin:8px 0 4px;font-weight:700}
.world.add{border-style:dashed;color:var(--ink-soft)}.speaking{outline:3px solid #f59e0b;outline-offset:2px;border-radius:6px;background:#fff7d6}body.read-aloud :is(p,li,h1,h2,h3,h4,.hmsg,.hint,blockquote,pre,.ln):hover{background:#fffbea;cursor:pointer}.btn.read-on{background:var(--accent-bg);border-color:var(--accent);color:var(--ink)}.mic-float{position:fixed;z-index:55;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line-strong);background:#fff;font-size:16px;line-height:1;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.15);padding:0}.mic-float.on,.btn.mic.on{background:#fee2e2;border-color:#ef4444;animation:micpulse 1s ease-in-out infinite}@keyframes micpulse{50%{box-shadow:0 0 0 6px rgba(239,68,68,.25)}}.speech-ways li{margin:4px 0}.nowrap-check{flex-wrap:nowrap;align-items:flex-start;margin:4px 0}.nowrap-check input{margin-top:3px}.speech-ways .this-one{background:var(--accent-bg);border-radius:8px;padding:3px 6px}.world.mine:not(.on){background:var(--accent-bg)}.world.more{border-style:dashed;color:var(--ink-soft);font-weight:700}.worlds-break{flex-basis:100%;height:0}.worlds-label{align-self:center;font-family:var(--display);font-weight:800;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin:0 4px 0 2px}.yours-list{display:grid;gap:6px;max-height:55vh;overflow:auto;padding:2px}.yours-item{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:7px 10px}.yours-item.on{border-color:var(--accent)}.yours-item label{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;cursor:pointer}.worlds-list{display:contents}
.new-choices{display:grid;gap:4px;margin-top:12px}.new-choices .hint{margin:0 0 8px}
.about-edit{margin:6px 0 10px;padding:8px 10px;border:1.5px solid var(--line);border-radius:12px;background:#fff}.about-edit summary{cursor:pointer}.about-edit .form-grid{grid-template-columns:1fr;gap:4px}.about-edit .form-grid label{margin-top:6px}.about-edit .row{flex-wrap:wrap}
.more{display:inline-block;margin-left:2px;padding:0 6px;border-radius:8px;background:var(--accent-bg);color:var(--accent);font-weight:800;cursor:pointer;line-height:1.35}.more:hover,.more:focus{outline:2px solid var(--accent);outline-offset:1px}
.full-text{white-space:normal;max-height:70vh;overflow:auto}pre.full-text{white-space:pre-wrap}
img.zoomable{cursor:zoom-in}img.zoomable:hover,img.zoomable:focus{outline:2px solid var(--accent);outline-offset:1px}
.zoom{display:flex;justify-content:center}.zoom img{width:min(100%, 72vh, 768px);height:auto;aspect-ratio:1/1;border:1px solid var(--line);border-radius:10px;background:#fff}
.world.needs{opacity:.5;border-style:dashed}.world.needs.on{opacity:.75}
.needs-note{background:var(--warn-bg);color:#6B4A0A;border-radius:10px;padding:8px 10px;margin:8px 0;font-size:13px}
.guide .steps li{margin:6px 0}.guide details.ref{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}.guide details.ref summary{cursor:pointer}.guide h4{margin:12px 0 4px}
.guide .big-idea{background:var(--accent-bg);border-radius:10px;padding:8px 10px}.guide-table{border-collapse:collapse;width:100%;font-size:13px}.guide-table th,.guide-table td{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}.guide-table th{background:#F3F6FA}
.pics{display:flex;flex-wrap:wrap;gap:6px}
.rcard.multi{flex-basis:236px}.rgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}.rthumb{position:relative;border-radius:8px;border:2px solid transparent}.rthumb img{width:100%;aspect-ratio:1/1;display:block;border-radius:6px;border:1px solid var(--line);background:#fff}.rthumb.chosen{border-color:var(--ok)}.rthumb.again{opacity:.7}.rthumb .mk{position:absolute;top:2px;right:4px;font-size:12px;font-weight:800;color:var(--ok);text-shadow:0 0 3px #fff}.rthumb.again .mk{color:var(--ink-soft)}
.ftree,.ftree ul{list-style:none;margin:0;padding-left:16px}.ftree{padding-left:0}.ftree ul{border-left:2px solid var(--line);margin-left:22px}.ftree li{margin:6px 0}.tnode{display:flex;align-items:center;gap:8px}.tnode img{width:56px;height:56px;border:1px solid var(--line);border-radius:8px;background:#fff}.tnode.chosen img{border:2px solid var(--ok)}
.contract{margin:6px 0 8px;padding:6px 10px;border-radius:10px;background:#F3F6FA;border:1px dashed var(--line);font-size:12.5px;line-height:1.6}
.mode-chip.untested .dot{background:var(--warn)}.mode-chip.failed .dot{background:var(--bad)}.mode-chip.failed{border-color:#F2BDB8}
.achip .round-mark{font-size:10.5px;color:var(--ink-faint)}
.achip .v-ok{color:var(--ok)}
.achip .v-bad{color:var(--bad)}
.picture-wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.picture{position:relative;width:min(100%,460px);aspect-ratio:1/1;margin:0 auto;background:#fff;border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.picture canvas{width:100%;height:100%;display:block}
.picture .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--ink-faint);font-size:14px}
.picture .tag{position:absolute;left:8px;top:8px;background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:800;color:var(--ink-soft)}
.bubbles{display:flex;flex-direction:column;gap:6px}
.bubble{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:7px 10px;font-size:13.5px;overflow-wrap:anywhere}
.bubble .who{font-size:11.5px;font-weight:800;color:var(--ink-soft);margin-bottom:1px}
.bubble.kind-model{border-left:4px solid var(--model)}
.bubble.kind-program{border-left:4px solid var(--program)}
.bubble.kind-renderer{border-left:4px solid var(--renderer)}
.bubble.err{border-color:#F2BDB8;background:var(--bad-bg)}
.strip-title{display:flex;align-items:center;gap:8px;margin:14px 0 6px;font-family:var(--display);font-weight:800;font-size:14.5px}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.rcard{flex:0 0 148px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:6px;font-size:11.5px}
.rcard.prev{opacity:.72}
.rcard img,.rcard .noimg{width:100%;aspect-ratio:1/1;border-radius:8px;border:1px solid var(--line);background:#fff;display:block}
.rcard .noimg{display:flex;align-items:center;justify-content:center;color:var(--ink-faint)}
.rcard .rn{font-weight:800;font-size:11.5px;color:var(--ink-soft);margin:4px 2px 2px}
.rcard .ln{margin:2px;overflow-wrap:anywhere}
.rcard .ln.p-ok{color:var(--ok)}
.rcard .ln.p-bad{color:var(--bad)}
.rcard.here{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg)}

/* drawing pad */
.pad{display:grid;grid-template-columns:160px 1fr;gap:10px}
.pad canvas{width:160px;height:160px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
.pad .cmds{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}
.pad .cmds button{border:1.5px solid var(--line-strong);background:#fff;border-radius:8px;padding:3px 8px;font-family:var(--mono);font-size:12px}
.pad .swatch{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--line-strong);padding:0}
@media (max-width:520px){.pad{grid-template-columns:1fr}.pad canvas{width:100%;height:auto;aspect-ratio:1/1}}

/* society (look inside) */
.inside-note{font-size:12.5px;color:var(--ink-soft);margin:0 0 10px}
.agent-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.acard{border:1.5px solid var(--line);border-radius:12px;padding:8px 9px;background:#fff;text-align:left;display:flex;flex-direction:column;gap:4px;border-top:4px solid var(--k)}
.acard:hover{border-color:var(--k)}
.acard .nm{font-family:var(--display);font-weight:800;font-size:14.5px;display:flex;gap:5px;align-items:center}
.acard .rl{font-size:11.5px;color:var(--ink-soft)}
.acard .bd{display:flex;gap:4px;flex-wrap:wrap}
.rules{display:flex;flex-direction:column;gap:7px}
.rule{border:1.5px solid var(--line);border-radius:12px;padding:8px 9px;background:#FCFDFF;font-size:12.5px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.rule.off{opacity:.55}
.rule .kw{font-weight:900;font-size:11px;letter-spacing:.6px;color:var(--ink-faint)}

libAgent({
  typeId: "ani-methods", name: "Method Chooser", emoji: "🧭", gate: false, group: "The Mini-Ani's programs, which make a story into a film together", note: "picks a way to show each thing that happens, and says what it crossed out",
  about: "For each thing that happens in a scene, it finds ways to show it, crosses out the ways that can't work (a chaser must be faster), prefers the ways that fit best and the ones the film hasn't used yet, and sends the plan to the Director.",
  pseudo: [
    "for each thing that happens in the scene, find the ways to show it:",
    "  someone who is {shy}: {keeps away} from someone on stage who isn't a friend",
    "  someone who is {mean, evil}: {chases off} someone on stage who isn't a friend",
    "  A {dominates} B: {looms over, chases off}",
    "  A {keeps} B from C: {stands guard}",
    "  A {helps} B: {goes along}",
    "  A {meets} B: {come together}",
    "  A {changes} B from X to Y: {goes to and changes}; A changes from X to Y: {comes closer bit by bit}",
    "  A {becomes} {happy}: {faster, livelier, curvier, brighter}",
    "  A becomes {sad}: {slower, calmer, straighter, dimmer}",
    "cross out chases off and stands guard unless A is faster than B, and any way that needs someone who isn't on stage",
    "cross out keeps away when A is drawn to strangers",
    "prefer chases off when A is bigger than B, stands guard when A dominates B, and goes along and come together when A is drawn to friends",
    "prefer a way the film hasn't used yet",
    "a change takes {8} frames (0: at once)",
    "if no way is left, A moves about in its own way, so its values still show",
    "send the plan, in order, to the Director, with the values of everyone on stage"
  ],
  code: [
    "function run(input, params, h) {",
    "  const WAYS = [\"keeps away\", \"chases off\", \"looms over\", \"stands guard\", \"goes along\", \"come together\", \"goes to and changes\", \"comes closer bit by bit\"];",
    "  const low = s => String(s == null ? \"\" : s).trim().toLowerCase();",
    "  const listOf = s => String(s == null ? \"\" : s).split(\",\").map(low).filter(w => w && w !== \"-\");",
    "  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);",
    "  const d = input.data || {};",
    "  const memory = input.memory || { used: [] };",
    "  const choices = d.choices || {}, onStage = d.onStage || [];",
    "  const call = n => (d.called || {})[n] || n;",
    "  const value = (who, el) => (choices[who] || {})[el] || 2;",
    "  const friends = (a, b) => (d.friends || []).some(p => (p[0] === a && p[1] === b) || (p[0] === b && p[1] === a));",
    "  const standIn = who => ((d.standIns || []).find(s => s.of === who) || {}).name || \"\";",
    "  const verbWays = [[low(params.dominates), listOf(params.dominatesWays)], [low(params.keeps), listOf(params.keepsWays)], [low(params.helps), listOf(params.helpsWays)], [low(params.meets), listOf(params.meetsWays)]];",
    "  const plan = [], notes = [], unknown = [];",
    "  const says = s => {",
    "    const a = call(s.who), b = call(s.whom || \"\"), c = call(s.third || \"\");",
    "    return cap(s.way === \"keeps away\" ? a + \" keeps away from \" + b : s.way === \"chases off\" ? a + \" chases \" + b + \" off\" : s.way === \"looms over\" ? a + \" looms over \" + b",
    "      : s.way === \"stands guard\" ? a + \" stands guard between \" + b + \" and \" + c : s.way === \"goes along\" ? a + \" goes along with \" + b : s.way === \"come together\" ? a + \" and \" + b + \" come together\"",
    "      : s.way === \"goes to and changes\" ? a + \" goes to \" + b + \" and changes \" + b : s.way === \"comes closer bit by bit\" ? a + \" comes closer, bit by bit\" : a + \" moves about in its own way\");",
    "  };",
    "  const crossedOut = (way, task) => {",
    "    const needs = way === \"stands guard\" ? [task.whom, task.third] : way === \"comes closer bit by bit\" ? [] : [task.whom];",
    "    const away = needs.find(n => !n || onStage.indexOf(n) < 0);",
    "    if (away !== undefined) return way + \" needs \" + (away ? call(away) + \" on stage\" : \"someone else on stage who isn't a friend\");",
    "    if ((way === \"chases off\" || way === \"stands guard\") && !(value(task.who, \"speed\") > value(task.whom, \"speed\"))) return way + \": \" + call(task.who) + \" isn't faster than \" + call(task.whom);",
    "    if (way === \"keeps away\" && value(task.who, \"strangers\") === 3) return way + \": \" + call(task.who) + \" is drawn to strangers\";",
    "    return \"\";",
    "  };",
    "  const bestWhen = (way, task) => {",
    "    if (way === \"chases off\" && value(task.who, \"size\") > value(task.whom, \"size\")) return \"best when \" + call(task.who) + \" is bigger than \" + call(task.whom);",
    "    if (way === \"stands guard\" && (d.relations || []).some(r => r.who === task.who && r.whom === task.whom && low(r.verb) === low(params.dominates))) return \"best when \" + call(task.who) + \" dominates \" + call(task.whom);",
    "    if ((way === \"goes along\" || way === \"come together\") && value(task.who, \"friends\") === 3) return \"best when \" + call(task.who) + \" is drawn to friends\";",
    "    return \"\";",
    "  };",
    "  const pick = (task, ways) => {",
    "    const ok = [];",
    "    for (const way of ways) {",
    "      h.tick();",
    "      if (WAYS.indexOf(way) < 0) {",
    "        if (unknown.indexOf(way) < 0) unknown.push(way);",
    "        continue;",
    "      }",
    "      const no = crossedOut(way, task);",
    "      if (no) {",
    "        notes.push(\"crossed out \" + no);",
    "        continue;",
    "      }",
    "      ok.push({ way: way, best: bestWhen(way, task), fresh: memory.used.indexOf(way) < 0 });",
    "    }",
    "    ok.sort((x, y) => (y.best ? 2 : 0) + (y.fresh ? 1 : 0) - (x.best ? 2 : 0) - (x.fresh ? 1 : 0));",
    "    if (!ok.length) return { way: \"moves about\", who: task.who, because: task.because + (ways.length ? \"; no way was left\" : \"\") };",
    "    for (const other of ok.slice(1)) {",
    "      h.tick();",
    "      notes.push(other.way + \" was passed over for \" + ok[0].way + (ok[0].best ? \" (\" + ok[0].best + \")\" : ok[0].fresh && !other.fresh ? \" (the film hasn't used it yet)\" : \"\"));",
    "    }",
    "    return { way: ok[0].way, who: task.who, whom: task.whom || \"\", third: task.third || \"\", because: task.because + (ok[0].best ? \"; \" + ok[0].best : \"\") };",
    "  };",
    "  const shy = listOf(params.shyWords), mean = listOf(params.meanWords);",
    "  for (const e of d.events || []) {",
    "    h.tick();",
    "    const verb = low(e.verb);",
    "    if (verb === low(params.becomes) && (e.what || []).length) {",
    "      const feeling = low(e.what[0]), words = feeling === low(params.happy) ? listOf(params.happyWays) : feeling === low(params.sad) ? listOf(params.sadWays) : [];",
    "      const changes = {};",
    "      for (const w of words) {",

    "        if (el) changes[el] = d.words[el][3] === w ? 1 : -1;",
    "        else if (unknown.indexOf(w) < 0) unknown.push(w);",
    "      }",
    "      plan.push({ way: \"feels\", who: e.who, feeling: feeling, changes: changes, because: \"\", says: cap(call(e.who)) + \" becomes \" + feeling + \": \" + words.join(\", \") });",
    "      continue;",
    "    }",
    "    if (verb === low(params.changes)) {",
    "      const step = e.whom ? pick({ who: e.who, whom: e.whom, because: (e.from || []).join(\" \") + \" → \" + (e.to || []).join(\" \") }, listOf(params.changesWays)) : pick({ who: e.who, because: (e.from || []).join(\" \") + \" → \" + (e.to || []).join(\" \") }, listOf(params.selfWays));",
    "      step.standIn = standIn(e.whom || e.who);",
    "      plan.push(step);",
    "      continue;",
    "    }",
    "    const others = onStage.filter(n => n !== e.who && !friends(n, e.who));",
    "    let ways = [], task = { who: e.who, whom: e.whom, third: e.also, because: e.verb };",
    "    if ((e.what || []).length) {",
    "      const word = e.what.find(w => shy.indexOf(low(w)) >= 0 || mean.indexOf(low(w)) >= 0);",
    "      ways = !word ? [] : shy.indexOf(low(word)) >= 0 ? listOf(params.shyWays) : listOf(params.meanWays);",
    "      task = { who: e.who, whom: others[0] || \"\", because: word || e.what.join(\", \") };",
    "    } else {",
    "      const vw = verbWays.find(x => x[0] === verb);",
    "      if (vw) ways = vw[1];",
    "      else if (unknown.indexOf(verb) < 0) unknown.push(verb);",
    "    }",
    "    plan.push(pick(task, ways));",
    "  }",
    "  for (const s of plan) {",
    "    h.tick();",
    "    if (!s.says) s.says = says(s);",
    "    if (memory.used.indexOf(s.way) < 0 && s.way !== \"moves about\" && s.way !== \"feels\") memory.used.push(s.way);",
    "  }",
    "  const shown = {}, strengths = {};",
    "  for (const name of onStage.concat((d.standIns || []).map(s => s.name))) {",
    "    h.tick();",
    "    if (choices[name]) shown[name] = choices[name];",
    "    if ((d.strengths || {})[name]) strengths[name] = d.strengths[name];",
    "  }",
    "  const say = \"**Scene \" + d.scene + \"'s plan:**\\n\" + plan.map((s, i) => (i + 1) + \". \" + s.says + (s.because ? \" (\" + s.because + \")\" : \"\") + \".\").join(\"\\n\") +",
    "    (notes.length ? \"\\n\\n\" + cap(notes.join(\"; \")) + \".\" : \"\") + (unknown.length ? \"\\n\\nI don't know how to show: \" + unknown.join(\", \") + \".\" : \"\");",
    "  return { scene: d.scene, of: d.of, title: d.title, cast: d.cast, called: d.called, onStage: onStage, plan: plan, ways: plan.map(s => s.way), choices: shown, strengths: strengths, standIns: d.standIns || [],",
    "    summary: d.summary, looksFrom: d.looksFrom || [], tasteLevel: d.tasteLevel || {}, changeFrames: +params.changeFrames || 0, notes: notes, say: say, memory: memory };",
    "}"

function parseSlotText(s) {

}

function slotPositions(text, slots) {

      const at = ln.indexOf(needle, from);

    const nt = Object.prototype.hasOwnProperty.call(params || {}, s.param) ? formatSlotValue(params[s.param], s.text) : s.text;
    out += String(text).slice(last, p.start) + "{" + nt + "}";

    const inLine = pos.filter(p => p.line === li + 1);
    if (!inLine.length) return null;

    for (const p of inLine) { re += reEsc(ol.slice(last, p.col)) + "\\{([^{}]*)\\}"; last = p.col + slots[p.slot].text.length + 2; }

    inLine.forEach((p, k) => { values[slots[p.slot].param] = parseSlotText(m[k + 1]); });

function paintOps(ctx, ops, scale) {
  ctx.setTransform(scale || 1, 0, 0, scale || 1, 0, 0);   // a small canvas draws at its own size: shrinking a big one can lose thin lines
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, 512, 512);
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  for (const o of ops || []) {
    if (o.t === "L") { ctx.strokeStyle = "#000"; ctx.strokeStyle = o.c; ctx.lineWidth = o.w; ctx.beginPath(); ctx.moveTo(o.x1, o.y1); ctx.lineTo(o.x2, o.y2); ctx.stroke(); }
    else if (o.t === "D") { ctx.fillStyle = "#000"; ctx.fillStyle = o.c; ctx.beginPath(); ctx.arc(o.x, o.y, o.s / 2, 0, Math.PI * 2); ctx.fill(); }
    else if (o.t === "T") { ctx.fillStyle = "#000"; ctx.fillStyle = o.c; ctx.font = Math.round(o.s) + "px system-ui, sans-serif"; ctx.fillText(o.text, o.x, o.y); }
  }
}
let rasterCanvas = null;
function rasterize(ops) {
  try {
    if (!rasterCanvas) { rasterCanvas = document.createElement("canvas"); rasterCanvas.width = 512; rasterCanvas.height = 512; }
    const ctx = rasterCanvas.getContext("2d");
    if (!ctx) return null;
    paintOps(ctx, ops);
    return rasterCanvas.toDataURL("image/png");
  } catch (e) { return null; }
}
const imgCache = new Map();
async function imageForRender(r, run) {
  if (!r) return null;
  const mem = run && run.renders && run.renders[r.renderId];
  if (mem && mem.program === r.program && mem.image) return mem.image;
  const key = hash((r.program || "") + "|" + (r.seed || 1));
  if (imgCache.has(key)) return imgCache.get(key);
  const res = await Runtime.runTurtle(r.program || "", { seed: r.seed || 1 });
  const url = rasterize(res.output && res.output.ops);
  if (imgCache.size > 300) imgCache.clear();
  imgCache.set(key, url);
  return url;
}
// A film's frames: from the run in memory, or by running its Logo again (traces keep programs, not pictures).
const filmCache = new Map();
async function filmOf(render, run) {
  if (!render || !(render.frames > 1)) return null;
  const mem = run && run.renders && run.renders[render.renderId];
  if (mem && mem.program === render.program && mem.film) return mem.film;
  const key = hash((render.program || "") + "|" + (render.seed || 1));
  if (filmCache.has(key)) return filmCache.get(key);
  const res = await Runtime.runTurtle(render.program || "", { seed: render.seed || 1 });
  const film = (res.ok && res.output && res.output.film) || null;

}

async function filmStills(render, run) {
  const film = await filmOf(render, run);

  const n = film.length;
  return Array.from(new Set([1, Math.ceil(n / 2), n])).map(at => ({ at, url: rasterize(film[at - 1].ops) })).filter(x => x.url);
}
const filmWords = r => "A film of " + plural(r.frames, "frame") + " (" + plural(r.seconds, "second") + ")";
let imgSeq = 0;
const imgJobs = new Map();
function imgTag(render, cls, alt, run) {
  if (!render) return "";
  const id = "im" + (++imgSeq);
  imgJobs.set(id, { render, run });

function hydrateImages(root) {

async function paintInto(canvas, render, run) {

// Markdown from a model, made safe: everything is escaped first, then a few marks become tags.
// Links show only their words, so nothing a model writes can be clicked.
function mdInline(s) {
  return s.split(/(`[^`\n]+`)/).map((part, i) => i % 2 ? "<code>" + part.slice(1, -1) + "</code>" : part
    .replace(/\[([^\]\n]+)\]\([^)\s]*\)/g, "$1")
    .replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>")
    .replace(/__([^_\n]+)__/g, "<b>$1</b>")
    .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,!?;:]|$)/g, "$1<i>$2</i>")
    .replace(/(^|[\s(])_([^_\n]+)_(?=[\s).,!?;:]|$)/g, "$1<i>$2</i>")).join("");
}
function md(text, compact) {
  const lines = esc(String(text == null ? "" : text)).replace(/\r\n?/g, "\n").split("\n");
  const out = [];
  let para = [], list = null;
  const endPara = () => { if (para.length) out.push("<p>" + para.map(mdInline).join("<br>") + "</p>"); para = []; };
  const endList = () => { if (list) out.push("<" + list.tag + ">" + list.items.map(x => "<li>" + mdInline(x) + "</li>").join("") + "</" + list.tag + ">"); list = null; };
  const item = (tag, text) => { endPara(); if (!list || list.tag !== tag) { endList(); list = { tag, items: [] }; } list.items.push(text); };
  for (let i = 0; i < lines.length; i++) {
    const ln = lines[i];
    let m;
    if (/^\s*```/.test(ln)) {
      endPara(); endList();
      const code = [];
      for (i++; i < lines.length && !/^\s*```/.test(lines[i]); i++) code.push(lines[i]);
      out.push('<pre class="box">' + code.join("\n") + "</pre>");
    } else if ((m = /^\s*#{1,6}\s+(.*)$/.exec(ln))) { endPara(); endList(); out.push('<p class="md-h">' + mdInline(m[1]) + "</p>"); }
    else if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(ln)) { endPara(); endList(); out.push("<hr>"); }
    else if ((m = /^\s*[-*•+]\s+(.*)$/.exec(ln))) item("ul", m[1]);
    else if ((m = /^\s*\d+[.)]\s+(.*)$/.exec(ln))) item("ol", m[1]);
    else if ((m = /^\s*&gt;\s?(.*)$/.exec(ln))) { endPara(); endList(); out.push("<blockquote>" + mdInline(m[1]) + "</blockquote>"); }
    else if (!ln.trim()) { endPara(); endList(); }
    else if (list && /^\s{2,}\S/.test(ln)) list.items[list.items.length - 1] += " " + ln.trim();
    else { endList(); para.push(ln); }
  }
  endPara(); endList();
  return '<div class="md' + (compact ? " compact" : "") + '">' + out.join("") + "</div>";
}

let LOGO_WORDS = null;

    else if (m[2]) out += '<span class="lg-q">' + esc(m[2]) + "</span>";
    else if (m[3]) out += '<span class="lg-v">' + esc(m[3]) + "</span>";

}

function filmNext() {   // after this frame's time: the next frame, the next film waiting, or the end

async function rerunScenarios(a) { a.results = await Scenarios.runScenarios(a, Runtime); }

function syncChallengeParams(s, a) {
  const ch = (s.challenges || []).find(c => c.id === s.challenge);

}
async function applyParamChange(a, values) {
  const s = app.societies[app.ui.editor ? app.ui.editor.socId : app.activeId];
  Society.setParams(a, values);
  syncChallengeParams(s, a);
  await rerunScenarios(a);

async function translateAndInstall(a, s, text) {
  const before = a.contract ? "" : contractText(a);   // to notice if the new program changes it
  a.pseudocode = util.cleanText(text, 3000);
  a.status = "translating";
  renderEditor();
  const adapter = getAdapter();
  const res = await Translator.translate(a, a.pseudocode, adapter, {});
  logWorkshop(s.id, { kind: "translate", title: "Translator: " + a.name, status: res.status, call: res.call ? Object.assign({ adapterLabel: adapter.label }, res.call) : null, error: res.status === "error" ? res.error : "" });
  if (res.status === "ok") { Society.installTranslation(a, a.pseudocode, res.result); if (res.result.uncovered && res.result.uncovered.length) a.statusDetail = null; toast(res.canned ? "Translated (pretend mode had this one ready)." : res.cached ? "Translated (this exact pseudocode was translated before)." : "Translated."); }
  else if (res.status === "needs") { a.status = "needs-translation"; a.statusDetail = { message: "Pretend mode can't write new code, so this agent keeps running its last good program. Connect a model in Settings to translate it." }; }
  else if (res.status === "refused") { a.status = "refused"; a.statusDetail = { refusals: res.refusals }; }
  else { a.status = "error"; a.statusDetail = { message: res.error }; if (res.errorKind) handleCallError({ errorKind: res.errorKind }); }
  syncChallengeParams(s, a);
  await rerunScenarios(a);
  delete a.contractNote;
  if (res.status === "ok" && before) { const after = Scenarios.contractOf(a.results); if (after !== before) a.contractNote = { before, after }; }
  save();
  renderEditor();
  renderLeft();
}
async function savePseudo() {
  const ed = app.ui.editor, a = editorAgent();
  if (!ed || !a || ed.busy) return;
  const box = $("#pseudoDraft");
  let text = box ? box.value : ed.draft;
  const s = app.societies[ed.socId];
  // A Gets / Says / Remembers header at the top is the contract, not pseudocode.
  const lines = String(text).split("\n"), head = [];
  let k = 0;
  while (k < lines.length && /^\s*(Gets|Says|Remembers)\s*:/i.test(lines[k])) head.push(lines[k++].trim());
  while (head.length && k < lines.length && !lines[k].trim()) k++;
  let contractChanged = false;
  if (head.length) { text = lines.slice(k).join("\n"); const cNew = head.join("\n"); if (cNew !== contractText(a)) { a.contract = util.cleanText(cNew, 600); contractChanged = true; } }
  ed.mode = "view";
  // Putting back exactly the pseudocode that is running needs no translation.
  if (a.code && text.trim() === String(a.code.pseudocode).trim() && a.pseudocode !== a.code.pseudocode) {
    a.pseudocode = a.code.pseudocode; a.status = "ok"; a.statusDetail = null; delete a.contractNote;
    await rerunScenarios(a); save(); renderEditor(); renderLeft();
    toast("That is the running version again, so no translation was needed.");
    return;
  }
  const c = Society.classifyPseudoEdit(a, text);
  if (c.kind === "same") { if (contractChanged) { save(); toast("Saved its contract: the translator keeps to it next time."); } renderEditor(); return; }
  if (c.kind === "params") { await applyParamChange(a, c.values); toast("Only the numbers changed, so no translation was needed."); return; }
  ed.busy = true;
  try { await translateAndInstall(a, s, text); } finally { ed.busy = false; renderEditor(); }
}

// The Helper can be moved (drag its top bar) and resized (drag its bottom corner), so it never has to hide a
// button you need; double-click the top bar to put it back in its corner. Where it is is kept with the settings.
function placeDrawer(d) {
  const b = app.settings.helperBox;
  if (!b) return;
  const W = window.innerWidth || 1024, H = window.innerHeight || 768;
  const w = Math.min(Math.max(280, b.w || 420), W - 16), h = Math.min(Math.max(240, b.h || 520), H - 16);
  Object.assign(d.style, { width: w + "px", height: h + "px", maxHeight: "none", left: Math.min(Math.max(8, b.x || 0), W - w - 8) + "px", top: Math.min(Math.max(8, b.y || 0), H - h - 8) + "px", right: "auto", bottom: "auto" });
}
function wireDrawer(d) {
  const head = d.querySelector(".dh");
  if (!head) return;
  head.addEventListener("pointerdown", ev => {
    if (ev.target.closest("button") || (ev.button != null && ev.button !== 0)) return;
    const r = d.getBoundingClientRect(), dx = ev.clientX - r.left, dy = ev.clientY - r.top, w = r.width || d.offsetWidth, h = r.height || d.offsetHeight;
    ev.preventDefault();
    const move = e => { app.settings.helperBox = { x: e.clientX - dx, y: e.clientY - dy, w, h }; placeDrawer(d); };
    const up = () => { document.removeEventListener("pointermove", move); document.removeEventListener("pointerup", up); save(); };
    document.addEventListener("pointermove", move); document.addEventListener("pointerup", up);
  });
  head.addEventListener("dblclick", ev => { if (ev.target.closest("button")) return; app.settings.helperBox = null; d.removeAttribute("style"); save(); });
  if (typeof ResizeObserver === "function") {
    let first = true, t = null;
    new ResizeObserver(() => {
      if (first) { first = false; return; }   // its first report is just its size now, not a resize
      clearTimeout(t);
      t = setTimeout(() => { if (!d.isConnected) return; const r = d.getBoundingClientRect(); if (r.width < 50) return; app.settings.helperBox = { x: r.left, y: r.top, w: r.width, h: r.height }; save(); }, 250);
    }).observe(d);
  }
}

  const adapter = getAdapter();

    logWorkshop(s.id, { kind: "helper", title: "Helper: " + q, status: "ok", call: { adapter: adapter.id, adapterLabel: adapter.label, model: r.model, persona: r.persona, pretend: !!r.pretend, system: r.system, messages: req.messages, request: r.request, reply: r.raw, ms: Math.round(r.ms || 0), warning: r.warning } });

}

    "<h4>Agents</h4><p><b>AI agents</b> follow instructions you can change in their editor. <b>Programmed agents</b> are pseudocode: numbers in green { } are settings you can change; edit a line and the translator turns it into JavaScript (<b>Peek under the hood</b> shows both). <b>Scenarios</b> are tests for a program: an input and what it should answer; a red one shows what went wrong, and you can save any turn from the trace as a new one. Some agents <b>collect</b>: they wait for several messages, then answer them all at once; an AI agent that collects sees all their pictures side by side. An agent called <b>You</b> is you. Each agent's editor shows its <b>Connections</b>: who can send it messages, and its own rules. Click an agent's emoji, at the top of its editor, to choose another.</p>" +
    "<h4>Saving and sharing</h4><p>Everything is saved in this browser as you go, so refreshing the tab keeps it all. It stays in this browser on this computer. <b>⬇ Export</b> at the top saves the society you are in as a file, to keep, move or give a friend; <b>⬆ Import</b> opens one. A grown-up can switch saving off in ⚙️ Settings; then the work is gone when the tab closes. <b>Delete this society</b>, in Look inside, deletes one of your own societies from this browser for good. Your own societies come after the microworlds, under <b>Yours</b>: the four you used last, and <b>☰ All yours</b> for the rest, where you can also tick several and delete them at once.</p>" +
    "<h4>Listening and talking</h4><p>Press <b>🔊 Read aloud</b> at the top, then click any words to hear them; point at a button to hear what it is. Press it again, or Esc, to stop. To talk instead of typing, click in a box and press the <b>🎤</b> beside it; in the Helper, the 🎤 asks your question and reads the answer to you. If your browser can't listen, the 🎤 shows how your computer can do it (on Windows, press the Windows key + H).</p>" +
    "<h4>The trace</h4><p>Every message is in the <b>Trace</b>. Open one to see what the agent got and what it said. <b>Show full technical details</b> shows exactly what a model was sent and what came back. A <b>…</b> opens text that was cut short, and a picture opens full size when you click it. After a run, <b>Replay</b> steps through it one message at a time.</p>" +
    "<h4>Logo</h4><p>Agents that draw write <b>Logo</b>: <code>FORWARD 50</code>, <code>RIGHT 90</code>, and <code>REPEAT 4 [FORWARD 50 RIGHT 90]</code> for a square. In Telephone, “Start with a drawing” lets you write Logo yourself, and you can change any drawing in the trace and see it drawn. <code>WAIT 15</code> keeps the picture so far as one frame of a film (WAIT counts in 60ths of a second, so 15 is a quarter second): <code>REPEAT 12 [CLEARSCREEN RIGHT 30 * REPCOUNT FORWARD 100 WAIT 15]</code> is a film of 12 frames, and the stage plays it with ▶ and a slider.</p>" +
    "<h4>Models</h4><p>A grown-up chooses the models in ⚙️ Settings: Gemini Nano (free, built into Chrome), or Claude, Gemini or OpenAI with a key. If they add more than one, you choose which agent uses which on the stage. Each microworld's question card says which model suits it.</p>" +
    "<h4>Tips</h4><ul><li>Change one thing at a time.</li><li>Run the same start twice and compare: AI agents don't always say the same thing.</li><li>Before you press Run, say what you think will happen.</li></ul>" +
    "</details>" },
  teacher: { title: "📕 A guide for teachers", html: () => {
    const D = Adapters.DEFAULT_MODELS, L = Adapters.modelLabel;
    const row = (name, model, why, calls) => "<tr><td><b>" + name + "</b></td><td>" + model + "</td><td>" + why + "</td><td>" + calls + "</td></tr>";
    return "<p class='big-idea'><b>The big idea:</b> what looks like intelligence often comes from how simple agents are arranged. A small model with a four-line notebook plays Secret Number far better than one without; Dot Counter, which can't see, counts better than Eyes; the Book remembers what the Editor smooths over.</p>" +
    "<h3>What learners do</h3><p>Learners (about 10 to 16) run, inspect, debug and change small societies of agents: AI agents, programmed agents written in editable pseudocode, and a Renderer that draws Logo. Everything is a glass box: every prompt, every reply, every program and every message is visible. Then they make their own with <b>＋ New society</b>.</p>" +
    "<h3>The microworlds, in teaching order</h3><ol class='worlds-list'>" +
    "<li><b>Story Chain: “Who remembers the dragon?”</b> Three writers add a sentence each; a Name Keeper checks the hero is still there; a Book keeps every sentence; when the run ends an Editor tells the story again. <i>Powerful ideas:</i> each agent gets only what rules send it (as well as whatever its model learned in training); a record (the Book) and a reconstruction (the Editor) are different kinds of memory.</li>" +
    "<li><b>Secret Number: “Can a notebook make it smarter?”</b> The Guesser has no memory; a four-line Notebook program keeps the clues. <i>Powerful ideas:</i> bookkeeping can look like intelligence; memory is not the same as strategy.</li>" +
    "<li><b>Lost and Found: “Where did it end up?”</b> A Finder names a drawing, and rules route it to shelves by its words. <i>Powerful ideas:</i> programs are literal and models are fuzzy; the wording decides where things go.</li>" +
    "<li><b>Telephone: “Where does it go?”</b> An Artist draws a sentence in Logo, a Describer describes the picture, round and round. <i>Powerful ideas:</i> iteration, fixed points and cycles, variance between runs.</li>" +
    "<li><b>Pebble Challenge: “Why did the Designer win?”</b> A Designer draws pebbles, Eyes counts them, a programmed Judge passes or blocks, and a Critic says what to fix. One click swaps Eyes for Dot Counter. <i>Powerful ideas:</i> critics can be gamed; perception versus judgment.</li>" +
    "<li><b>Three Eyes: “Are three heads better than one?”</b> Three Eyes count the same picture and a Vote program takes the most popular answer. <i>Powerful idea:</i> voting helps when the voters are reasonably good and their mistakes differ; copies of one model often fail together.</li>" +
    "<li><b>Fool the Eyes: “Can a drawing trick a looker?”</b> A Trickster draws pebbles to fool Eyes; a Referee keeps score. <i>Powerful idea:</i> an adversary finds weaknesses a friendly test never would.</li>" +
    "<li><b>Joke Workshop: “Do critics make jokes funnier?”</b> A Joker writes, two Critics send notes, and the learner rates every version. <i>Powerful idea:</i> whose judgment counts, and whether critics improve work or only make it more careful.</li>" +
    "<li><b>Small Helper, Big Helper: “When do you need the big one?”</b> A cheap model tries first; an Escalator hands the job to a strong one when it fails. It needs two models. <i>Powerful idea:</i> cost against capability.</li></ol>" +
    "<p><b>Examples to start from</b> (“＋ New society”): <b>Evolution</b>, where three Mutators change a drawing, a Critic scores the parent and the variants together, and a Selector keeps the winner; the trace's Family tree shows which picture came from which. <i>Powerful idea:</i> a simple critic and chooser, arranged in a loop, steer a model somewhere it wouldn't go alone. It needs a model that sees pictures well, and makes about 4 model calls per round. <b>Two Answers</b>, after the paper <i>Contemplative Artificial Intelligence</i> (Laukkonen and others, 2025): the same question goes to a Plain agent and to a Contemplative one asked to pause on four principles first. <i>Powerful idea:</i> the instructions are the only difference, so learners can change one principle and see what it does; and wise is not the same as careful. Any model; 2 or 3 calls a run. <b>Tic-Tac-Toe</b>: a learner plays X against an AI Rival, and a Referee program keeps the board. <i>Powerful idea:</i> the model suggests and the program decides; a rule written as a program holds however confident the model sounds. Any model (weaker ones make more illegal moves, which is the point); about 5 calls a game, or 9 with Two AIs. <b>Trail Mix Barter</b>, from Ken Kahn's experiments: three AI traders, each starting with one ingredient, take turns to barter, and a Ledger program keeps the accounts. <i>Powerful idea:</i> agents can talk their way into a deal, but a program has to keep the books; when one chatbot played all three traders, the grams stopped adding up. Try a different model for each trader. About 2 calls a trade, 20 rounds at most. <b>Artist and Critic</b>, Ken Kahn's society: an Artist draws, a Critic who knows what was asked for scores each picture and suggests one change, and a Scorekeeper keeps the scores. <i>Powerful idea:</i> whether feedback helps depends on who gives it and what they know; and a critic scoring work done on its own advice may not be a fair judge. Needs a model that sees pictures well; 2 calls a round. <b>Mini-Ani</b>, Ken Kahn's 1978 program Ani in miniature (<a href=\"https://toontalk.github.io/ani/\" target=\"_blank\" rel=\"noopener\">Ani's own 1978 film</a>): a Cast reads a story; Personality, Looks, Relationships and Taste suggest how each character moves and looks; the Choice Points settle their arguments in the open and say why; a Method Chooser plans each scene, and a Director writes it as a Logo film. <i>Powerful idea:</i> taste can be built: small experts argue in the open, the film changes when you add knowledge, and every choice can say why. It needs no model, so a run makes no calls. <b>Mini-Ani with AI voices</b> adds AI agents where words are needed: an AI Animator whose lines in Ani's words the Choice Points weigh like an expert's, a Reader that turns a story told in your own words into the Cast's sentences, and a Narrator that tells the finished film; You can join in as one more expert. <i>Powerful idea:</i> language can go to models while the weighing stays with programs you can read. Any model that writes short lines; 4 or 5 calls a run.</p>" +
    "<h3>Which model, and how many calls</h3><p>Model choice is where sessions get stuck, so here is what we have seen. Calls are model calls in one run with the default rounds; each AI agent's button counts them after a run.</p>" +
    "<table class='guide-table'><tr><th>Microworld</th><th>Model</th><th>Why</th><th>Calls per run</th></tr>" +
    row("Story Chain", "any, even Gemini Nano", "only text; the lesson is in what each writer sees", "13") +
    row("Secret Number", "any, even Gemini Nano", "the Guesser only says a number", "up to 10 (about 7 with the Notebook)") +
    row("Lost and Found", "stronger than Nano for the Drawer and Finder", "they draw and name pictures", "2") +
    row("Telephone", "stronger than Nano", "the Artist writes Logo, the Describer sees pictures; Nano fails before there is anything to study", "8") +
    row("Pebble Challenge", "one that sees pictures well", "Eyes counts pictures; the Designer writes Logo", "3 per try, up to 15") +
    row("Three Eyes", "different models for the three Eyes, if you have them", "copies of one model make the same mistakes", "4") +
    row("Fool the Eyes", "a strong one for the Trickster", "it has to write tricky Logo", "8") +
    row("Joke Workshop", "any that writes well", "the learner does the judging", "up to 9") +
    row("Small Helper, Big Helper", "two: a cheap one and a strong one", "it compares them", "1 per try, up to 6") +
    "</table><p>Settings starts each key-based provider on a cheap model (" + L("anthropic", D.anthropic) + ", " + L("gemini", D.gemini) + ", " + L("openai", D.openai) + ") and lists stronger ones. A grown-up sets up the models; with more than one, learners choose which agent uses which in the Models row on the stage, without opening Settings.</p>" +
    "<h3>Sessions to try</h3><p>No child has used the kit yet, so these are guesses to test, not results.</p><ol>" +
    "<li><b>Where did Pip go?</b> (Story Chain) Run it and count the rounds until Pip disappears. Tick “Writer A remembers” and run again. Then compare the Book with the Editor's story: what did the Editor leave out, or make up?</li>" +
    "<li><b>Is the Guesser smarter?</b> (Secret Number) To compare fairly, switch off the random secret and choose it yourself; try a few different secrets. Run with no Notebook and count the guesses, then switch the Notebook on and run again with the same model and the same secrets. Then tick “You be the Guesser” and try to beat it. (For casual play, leave the secret random.)</li>" +
    "<li><b>Predict, run, compare.</b> (Telephone) Run twice with the same start. How different are the runs? Which starts settle, which flip back and forth?</li>" +
    "<li><b>Game the judge.</b> (Pebble Challenge) Can the Designer win without meeting the challenge? Which tricks fooled Eyes, and which fooled Dot Counter?</li>" +
    "<li><b>Read and write programs.</b> Open a Judge or the Notebook, change a number in a slot, then change a line and watch the scenarios.</li>" +
    "<li><b>Does the Critic help?</b> (Pebble Challenge or Joke Workshop) Run with and without the critics. If nothing gets worse, what were they for?</li>" +
    "<li><b>Make your own.</b> ＋ New society, copy a microworld, and change its question to one the learners care about.</li></ol>" +
    "<h3>Seat two learners at one society</h3><p>One drives; the other predicts and writes down what happens; swap every run. Then use <b>scenario files</b> to challenge each other: each pair exports scenarios designed to break the other pair's agent, the other pair imports them, and the fixing begins.</p>" +
    "<h3>What to say when a learner is stuck</h3><p>Questions, not answers:</p><ul><li>“What did it actually get sent?” (Open its trace entry: “It got …”.)</li><li>“What would a program have to count to decide that?”</li><li>“Which agent decided that, and what did it look at?”</li><li>“What do you think will happen? Why?”</li><li>“If you ran it again, would it say the same?”</li></ul>" +
    "<h3>Misconceptions to watch for</h3><ul><li><b>“The AI knows.”</b> The trace shows everything this kit sent an agent and everything it sent back. A model also brings what it learned in training, which the trace can't show.</li><li><b>“The AI is lying.”</b> The trace shows no evidence of a plan to deceive; look at its instructions and the messages it got, and ask what a likely-sounding answer would have been.</li><li><b>“The program is clever.”</b> The program that runs is the JavaScript translated from its pseudocode, and it does exactly what that says, which is why “dogs” isn't “dog”. Scenarios are how you check that the two match.</li><li><b>“Same start, same result.”</b> AI agents vary from run to run; programs don't.</li><li><b>“Bigger is always better.”</b> Small Helper, Big Helper shows when it isn't worth it.</li><li><b>“The Editor's story is what happened.”</b> The Book is the record.</li></ul>" +
    "<h3>Safety and privacy</h3><ul><li><b>What learners type is sent to the model's provider</b> (Anthropic, Google or OpenAI), along with the agents' messages and pictures, except with Gemini Nano, which runs on the computer. Tell learners not to type names, addresses or anything personal.</li><li>Every model call starts with a fixed, visible safety preamble for a young audience.</li><li>Keys stay in this browser unless you choose to remember them; they are never put in exported files.</li><li>Imported files are checked: text is cleaned, and any JavaScript in them is thrown away and translated again here.</li><li>Programs run behind a checker, a step counter and (where the page allows) a Worker. Drawings are Logo, read by an interpreter that can only move the turtle.</li><li>The Helper asks questions back, and never states the fix for a failing scenario.</li></ul>";
  } }
};
function openGuide(which) {

/* ===== SECTION: IMPORT / EXPORT ===== */
function uniqueSocietyId(base) { let id = util.cleanId(base) || "society", n = 2; const b = id; while (app.societies[id]) id = b + "-" + n++; return id; }
async function importSocietyText(text) {
  const { society, trace } = Society.importSociety(text);
  const same = app.order.find(id => app.societies[id].title.trim().toLowerCase() === society.title.trim().toLowerCase());
  let replace = null;
  if (same && !isMicroworld(same)) {
    const pick = await uiChoose("You already have a society called “" + society.title + "”. Replace yours with the one in this file, or keep both?", { title: "Import “" + society.title + "”", choices: [["replace", "Replace mine", "danger"], ["both", "Keep both", "primary"]] });
    if (!pick) return null;
    if (pick === "replace") replace = same;
  }
  if (replace) {
    const r = app.runs[replace]; if (r) r.api.stop();
    society.id = replace;
    delete app.runs[replace]; delete app.traces[replace]; delete app.prevStrips[replace];
  } else {
    if (same) society.title = uniqueTitle(society.title);
    society.id = uniqueSocietyId(isMicroworld(society.id) ? society.id + "-imported" : society.id);
    app.order.push(society.id);
  }
  app.societies[society.id] = society;
  app.activeId = society.id;
  touch(society.id);
  if (trace && trace.length) app.traces[society.id] = trace;
  const needs = society.agents.filter(a => a.kind === "program" && a.status !== "ok");
  if (needs.length && liveConnection()) for (const a of needs) await translateAndInstall(a, society, a.pseudocode);
  for (const a of society.agents) if (a.kind === "program") await rerunScenarios(a);
  save();
  renderAll();
  const left = society.agents.filter(a => a.kind === "program" && a.status !== "ok").length;
  try { window.scrollTo(0, 0); } catch (e) { /* no scrolling here */ }
  toast((replace ? "Replaced “" : "Imported “") + society.title + "”: " + society.agents.length + " agents, " + society.rules.length + " rules." + (left ? " " + left + " program" + (left === 1 ? " needs" : "s need") + " translating." : ""));
  return society;
}
function exportSocietyFlow() {
  const s = soc();
  const trace = runOrLastTrace(s.id);
  const m = openModal({ title: "Export “" + s.title + "”", body: '<p>This saves the society as a file: its agents, rules, settings, pseudocode and scenarios. API keys are never included. Share it only with people you trust.</p><label class="row small"><input type="checkbox" id="withTrace"' + (trace.length ? " checked" : " disabled") + '> Include the last run’s trace</label><div class="row end" style="margin-top:12px"><button class="btn" data-close>Cancel</button><button class="btn primary" id="doExport">Export</button></div>' });
  $("#doExport", m.body).onclick = () => { const withTrace = $("#withTrace", m.body).checked; m.close(); offerFile("agent-kit-" + s.id + ".json", Society.exportSociety(s, withTrace ? slimTrace(trace) : null), "application/json"); };
}
async function traceDocument(s, trace, run) {

    else if (e.kind === "ending" || e.kind === "note") parts.push('<p class="slim">' + (e.kind === "ending" ? "⏳ " : "⏹ ") + esc(e.text) + '</p>');
    else if (e.kind === "run-end") parts.push('<p class="slim">■ ' + esc(e.text) + '</p>');

      let img = "", got = "";
      const stills = e.render && !e.render.error && e.render.frames > 1 ? await filmStills(e.render, run) : [];

      else if (e.render && !e.render.error) { const url = await imageForRender(e.render, run); if (url) img = '<img class="zoom" tabindex="0" src="' + url + '" alt="' + esc("the " + e.agentName + "’s picture, round " + e.round) + '" title="Click to see it full size">'; }
      if (e.message && e.message.renderId) { const r = findRender(trace, e.message.renderId); const url = r ? await imageForRender(r, run) : null; if (url) got = '<img class="zoom" tabindex="0" src="' + url + '" alt="' + esc("the picture " + e.agentName + " was sent") + '" title="Click to see it full size">'; }
      const logoOf = text => '<pre class="logo">' + logoHTML(text) + '</pre>';
      const said = e.error ? "⚠ " + e.error : e.response ? summaryText(e, s) : "";
      let body = "";
      if (e.message && !e.render) body += '<h4>Message in (from ' + esc(e.message.fromName) + ')</h4><pre>' + esc(e.message.text || "") + (e.message.data && Object.keys(e.message.data).length ? "\n" + esc(JSON.stringify(e.message.data, null, 1)) : "") + '</pre>' + got;
      if (e.call) body += '<h4>System prompt</h4><pre>' + esc(e.call.system || "") + '</pre><h4>Messages</h4>' + (e.call.messages || []).map(m => '<pre><b>' + esc(m.role) + ':</b> ' + esc(m.content) + '</pre>').join("") + '<h4>Reply' + (e.call.pretend ? " (pretend)" : "") + ' — ' + esc(e.call.model || "") + '</h4>' + (isProgramReply(e, s) ? logoOf(e.call.reply || "") : '<pre>' + esc(e.call.reply || "") + '</pre>');
      if (e.program) body += '<h4>Program input</h4><pre>' + esc(JSON.stringify(e.program.input, null, 1)) + '</pre><h4>Output</h4><pre>' + esc(JSON.stringify(e.program.output, null, 1)) + '</pre>';
      if (e.render) body += '<h4>The Logo program it drew' + (e.message ? " (sent by " + esc(e.message.fromName) + ")" : "") + '</h4>' + logoOf(e.render.program) + img;
      if (e.fired && e.fired.length) body += '<h4>Rules</h4><ul>' + e.fired.map(f => '<li>→ ' + esc(f.toName) + ' ' + esc(firedText(f)) + '</li>').join("") + '</ul>';

    }
  }
  const css = "body{font-family:system-ui,sans-serif;max-width:900px;margin:24px auto;padding:0 16px;color:#1D2A44;background:#F7F9FC}h1{font-size:24px}details{background:#fff;border:1px solid #E1E7F0;border-left:5px solid #8A94AB;border-radius:10px;margin:6px 0;padding:6px 10px}details.model{border-left-color:#6655F0}details.program{border-left-color:#12876A}details.renderer{border-left-color:#B96F07}summary{cursor:pointer}pre{white-space:pre-wrap;background:#F3F6FA;border-radius:8px;padding:8px;font-size:12px}pre.logo{background:#FCFBF5;line-height:1.55}img{width:260px;border:1px solid #E1E7F0;border-radius:8px;background:#fff}img.zoom{cursor:zoom-in}h4{margin:10px 0 4px;font-size:13px;color:#56627C}.slim{color:#56627C}.film{display:flex;flex-wrap:wrap;gap:8px}.film figure{margin:0}.film img{width:200px}figcaption{font-size:12px;color:#56627C;text-align:center}" +
    ".lg-k{color:#5B4BDB;font-weight:700}.lg-n{color:#B05E00}.lg-q{color:#12876A}.lg-v{color:#2563EB}.lg-b{color:#8A94AB;font-weight:700}.lg-c{color:#8A94AB;font-style:italic}" +
    "img.zoom:focus{position:fixed;inset:0;margin:auto;width:min(92vw,88vh,768px);height:auto;z-index:9;cursor:zoom-out;outline:none;box-shadow:0 0 0 100vmax rgba(20,28,45,.82)}";   // no script: a click focuses the picture, which fills the page; a click anywhere else puts it back
  return '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>' + esc(s.title) + ' trace</title><style>' + css + '</style></head><body><h1>' + esc(s.title) + ': a trace</h1><p>Exported from Agent Kit ' + esc(AK.VERSION) + ' on ' + esc(new Date().toLocaleString()) + '. Open any line to see exactly what was sent and what came back.</p>' + parts.join("") + '</body></html>';
}

const ACTIONS = {
  world(t) { showSociety(t.dataset.id); },
  look() { app.ui.lookInside = !app.ui.lookInside; if (window.innerWidth <= 820) app.ui.mobileTab = app.ui.lookInside ? "inside" : "stage"; renderWorlds(); renderLeft(); },

async function handleBind(t, evt) {
  const b = t.dataset.bind;
  if (!b) return;
  const s = soc();
  const change = evt === "change";
  switch (b) {
    case "start-value": { const st = (s.starts || []).find(x => x.id === t.dataset.id); if (st) { st.value = util.cleanText(t.value, 20000); save(); if (st.kind === "program") paintPad(); else fitStart(t); } return; }
    case "challenge-task": { const ch = (s.challenges || []).find(c => c.id === t.dataset.id); if (ch) { ch.task = util.cleanText(t.value, 400); save(); } return; }
    case "roundLimit": if (change) { s.roundLimit = Math.max(1, Math.min(50, Math.round(+t.value) || 4)); save(); renderAll(); } return;
    case "speed": { app.settings.speed = t.value; const r = app.runs[app.activeId]; if (r) r.api.setDelay(speedDelay(), filmsWait()); save(); return; }
    case "roundAgent": if (change) { s.roundAgent = t.value; save(); renderAll(); } return;
    case "variant": { Society.applyVariant(s, t.dataset.id, t.checked); save(); renderAll(); return; }
    case "bench-times": { const a = editorAgent(); if (!a) return; const key = s.id + "/" + a.id; app.ui.bench[key] = Object.assign(app.ui.bench[key] || { results: [] }, { times: Math.max(1, Math.min(10, Math.round(+t.value) || 3)) }); renderEditor(); return; }
    case "new-secret": { const ch = (s.challenges || []).find(c => c.id === t.dataset.id); const r = ch ? ch.random : !t.dataset.id && s.random; if (r) { r.on = t.checked; save(); if (!ch) renderStage(); } return; }
    case "play-as": {
      app.ui.playAs[s.id] = t.checked ? s.roundAgent : null;
      renderStage();
      const a = Society.agentById(s, s.roundAgent);
      if (t.checked && a) toast("Press ▶ Run. You write what the " + a.name + " writes, and the other agents answer you.");
      return;
    }
    case "your-answer": { app.ui.yourDraft[draftKey(s)] = String(t.value); paintYours(); return; }
    case "logo-edit": { if (app.ui.logoEdit) { app.ui.logoEdit.text = String(t.value); paintLogoEdit(); } return; }
    case "replay": { setReplay(+t.value); return; }

      if (!f) return;
      clearTimeout(filmTimer);

      return;
    }

      const P = Society.sendParts(r.send);

      if (next) r.send = next;
      save(); rulesChanged();
      return;
    }
    case "rule": {

      if (f === "enabled") r.enabled = t.checked;
